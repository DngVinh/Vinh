$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://campus247.example/schemas/evals/eval-result.schema.yaml"
title: "Campus 24/7 per-case evaluation result"
type: "object"
additionalProperties: false
required: ["schema_version", "run_id", "case_id", "case_version", "attempt", "started_at", "completed_at", "environment", "versions", "status", "actual", "assertion_results", "rubric_result", "sanitized_input_hash", "actual_output_hash", "side_effect_diff", "audit_event_refs", "failure_codes"]
properties:
  schema_version: {const: "1.0"}
  run_id: {$ref: "#/$defs/uuid_v7"}
  case_id: {type: "string", pattern: "^EVAL-[A-Z0-9]+(?:-[A-Z0-9]+)*-[0-9]{3}$"}
  case_version: {type: "string", pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
  attempt: {type: "integer", minimum: 1, maximum: 20}
  started_at: {type: "string", format: "date-time"}
  completed_at: {type: "string", format: "date-time"}
  environment: {type: "string", enum: ["local_fake", "ci_fake", "isolated_live_candidate"]}
  versions: {$ref: "#/$defs/versions"}
  status: {type: "string", enum: ["passed", "failed", "not_verified", "skipped"]}
  actual: {$ref: "#/$defs/actual"}
  assertion_results:
    type: "array"
    minItems: 1
    maxItems: 30
    items: {$ref: "#/$defs/assertion_result"}
  rubric_result:
    oneOf:
      - $ref: "#/$defs/rubric_result"
      - type: "null"
  sanitized_input_hash: {$ref: "#/$defs/sha256"}
  actual_output_hash: {$ref: "#/$defs/sha256"}
  side_effect_diff: {$ref: "#/$defs/side_effect_diff"}
  audit_event_refs:
    type: "array"
    uniqueItems: true
    maxItems: 50
    items: {type: "string", pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"}
  failure_codes:
    type: "array"
    uniqueItems: true
    maxItems: 20
    items: {type: "string", pattern: "^[A-Z][A-Z0-9_]{1,79}$"}
  reviewer_refs:
    type: "array"
    uniqueItems: true
    items: {type: "string", pattern: "^ROLE-[A-Z][A-Z0-9_-]{2,63}$"}
$defs:
  uuid_v7:
    type: "string"
    format: "uuid"
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  sha256:
    type: "string"
    pattern: "^sha256:[0-9a-f]{64}$"
  versions:
    type: "object"
    additionalProperties: false
    required: ["git_ref", "dataset_hash", "provider_id", "model_id", "prompt_hash", "retrieval_profile", "index_version", "tool_registry_version", "policy_version", "temperature", "seed"]
    properties:
      git_ref: {type: "string", minLength: 1, maxLength: 200}
      dataset_hash: {$ref: "#/$defs/sha256"}
      provider_id: {type: "string", minLength: 1, maxLength: 100}
      model_id: {type: "string", minLength: 1, maxLength: 200}
      prompt_hash: {$ref: "#/$defs/sha256"}
      retrieval_profile: {type: "string", minLength: 1, maxLength: 100}
      index_version: {type: "string", minLength: 1, maxLength: 100}
      tool_registry_version: {type: "string", pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      policy_version: {type: "string", minLength: 1, maxLength: 100}
      temperature: {type: "number", minimum: 0, maximum: 2}
      seed: {type: ["integer", "null"]}
  actual:
    type: "object"
    additionalProperties: false
    required: ["route", "terminal", "tool_id", "tool_status", "citation_ids", "output_disposition"]
    properties:
      route: {type: ["string", "null"], maxLength: 100}
      terminal: {type: ["string", "null"], maxLength: 100}
      tool_id: {type: ["string", "null"], maxLength: 100}
      tool_status: {type: ["string", "null"], maxLength: 100}
      citation_ids:
        type: "array"
        uniqueItems: true
        maxItems: 20
        items: {type: "string", maxLength: 200}
      output_disposition: {type: "string", enum: ["released", "buffered_rejected", "safe_template", "no_output"]}
  assertion_result:
    type: "object"
    additionalProperties: false
    required: ["assertion_id", "passed", "evidence_ref"]
    properties:
      assertion_id: {type: "string", pattern: "^A-[0-9]{2}$"}
      passed: {type: "boolean"}
      evidence_ref: {type: "string", minLength: 1, maxLength: 500}
      failure_code: {type: ["string", "null"], pattern: "^[A-Z][A-Z0-9_]{1,79}$"}
  rubric_result:
    type: "object"
    additionalProperties: false
    required: ["rubric_id", "scores", "percentage", "passed", "review_method"]
    properties:
      rubric_id: {type: "string", pattern: "^RUBRIC-[A-Z0-9-]+$"}
      scores:
        type: "object"
        minProperties: 1
        maxProperties: 20
        propertyNames: {pattern: "^[a-z][a-z0-9_]{1,63}$"}
        additionalProperties: {type: "integer", minimum: 0, maximum: 4}
      percentage: {type: "number", minimum: 0, maximum: 100}
      passed: {type: "boolean"}
      review_method: {type: "string", enum: ["deterministic", "human", "blinded_human", "llm_judge_with_corroboration"]}
  side_effect_diff:
    type: "object"
    additionalProperties: false
    required: ["created", "updated", "deleted", "external_calls"]
    properties:
      created: {type: "integer", minimum: 0}
      updated: {type: "integer", minimum: 0}
      deleted: {type: "integer", minimum: 0}
      external_calls: {type: "integer", minimum: 0}
