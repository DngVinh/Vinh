acceptance_criteria:
- assertion: No public route executes a controlled write without authorization, preview
    binding, confirmation, and idempotency.
  id: AC-TASK-API-WRITEFIX-001-01
- assertion: A stale, altered, cross-user, or replayed confirmation produces no duplicate
    side effect.
  id: AC-TASK-API-WRITEFIX-001-02
- assertion: Route inventory fails when a new write route lacks the controlled-write
    marker and tests.
  id: AC-TASK-API-WRITEFIX-001-03
- assertion: The changed-file set stays inside write_scope and all logs, errors, fixtures,
    and evidence exclude secrets and unnecessary personal data.
  id: AC-TASK-API-WRITEFIX-001-99
approval_reasons:
- authorization
- security_policy
bounded_context: write-boundary
dependencies:
- TASK-API-AUTHFIX-001
- TASK-API-ACTION-003
estimated_minutes: 45
evidence_required:
- initial and final git status
- exact changed-file and diff summary
- commands with exit codes and deterministic test output
- acceptance-criterion to evidence mapping
- negative-path and no-side-effect proof
execution_policy:
  destructive_operations: false
  max_fix_attempts: 2
  network_access: false
  paid_services: false
human_approval_required: true
id: TASK-API-WRITEFIX-001
inputs:
- load: full
  path: docs/00-governance/DOCUMENT_CONTROL.md
- load: full
  path: docs/09-agent-execution/AUDIT_REMEDIATION_EXECUTION_GUIDE.md
- load: full
  path: docs/05-ai/TOOL_USE_POLICY.md
layer: api
objective: Route every externally reachable state-changing operation through authorization,
  preview, explicit confirmation, idempotency, and auditable execution controls.
parallelism:
  conflict_keys:
  - api-write-routes
  eligible: true
phase: P03
preconditions:
- Every dependency is accepted, each normative input is approved, and this draft task
  has passed readiness review.
- The orchestrator has verified a non-overlapping write lease and preserved the complete
  pre-existing Git state.
- Any required human approval names this task, its exact scope, and the current proposed
  security behavior.
priority: P0
recovery:
  steps:
  - Stop promotion and apply a reviewed reverse patch limited to this task; preserve
    audit evidence and reconcile any result-unknown operation before retry.
  strategy: reverse_patch
schema_version: '1.1'
sensitivity: critical
status: accepted
steps:
- Read every input fully; map each normative MUST, failure state, and trust boundary
  to a testable implementation decision.
- Enumerate state-changing routes and classify each as controlled write, internal
  callback, or read-only operation.
- Remove or guard any path that can execute a write without a valid preview-bound
  confirmation and idempotency key.
- Test direct calls, stale previews, replay, cross-user confirmation, and ambiguous
  downstream outcomes.
- Run verification in order, inspect the scoped diff and final status, and emit schema-valid
  acceptance-to-evidence mapping.
stop_conditions:
- A normative source conflicts with another source, changed after review, or does
  not define the required security behavior.
- Completion needs an unlisted file, dependency, network call, live provider, credential,
  destructive operation, or broader policy change.
- Authorization, confirmation binding, idempotency, privacy, auditability, or failure
  atomicity cannot be proven by deterministic tests.
title: Block direct write routes that bypass preview and confirmation
traceability:
  contracts:
  - ActionPreview.v1
  - API-IDEM-001
  - API-IDEM-007
  controls:
  - SEC-AUTHZ-003
  - SEC-CTRL-008
  - SEC-AUDIT-006
  design:
  - ADR-016
  - ARCH-006
  evals:
  - EVAL-METRIC-010
  - EVAL-DATA-TOOL-001
  requirements: []
verification:
- command: python -B -m pytest -q tests/contract/test_write_route_inventory.py
  expected_exit_code: 0
  proves: Focused positive, adversarial, concurrency, and failure-path behavior passes
    deterministically.
- command: python -B tasks/tools/validate_catalog.py
  expected_exit_code: 0
  proves: Task catalog, dependency graph, traceability, approval, and write-scope
    invariants remain valid.
write_scope:
  allowed_paths:
  - services/api/src/campus247/presentation/ticket_queries.py
  - services/api/src/campus247/presentation/rooms.py
  - tests/contract/test_write_route_inventory.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_added_lines: 320
  max_files: 3
