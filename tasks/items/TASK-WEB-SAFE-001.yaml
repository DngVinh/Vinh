schema_version: "1.1"
id: TASK-WEB-SAFE-001
phase: P06
title: "Replace fabricated emergency contacts with approved fallback UX"
status: accepted
objective: "Replace fabricated emergency telephone details with the human-approved, accessible unavailable-configuration fallback and honest handover status."
layer: web
bounded_context: redesign-safety-handover
priority: P0
estimated_minutes: 35
sensitivity: critical
human_approval_required: true
approval_reasons: ["security_policy"]
traceability:
  requirements: ["REQ-F-HITL-007"]
  acceptance_criteria: ["AC-REQ-F-HITL-007-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-TRUST-001", "UX-A11Y-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-WEB-HITL-001", "TASK-DOC-UX-003", "TASK-DOC-UX-004"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/01-product/PRD.md", load: "full"}, {path: "docs/03-ux/CONTENT_STYLE_VI.md", load: "full"}]
write_scope:
  allowed_paths: ["apps/web/src/features/handover/HandoverPanel.tsx", "apps/web/src/features/handover/HandoverPanel.test.tsx", "apps/web/e2e/handover.spec.ts"]
  forbidden_paths: [docs/**, contracts/**, .git/**]
  max_files: 3
  max_added_lines: 300
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Render only configured verified contacts, show approved fallback when absent, avoid claims that a human has received or will answer, make critical content perceivable without color, and update unit and journey assertions."
  - Implement only the stated objective within the allowed paths and do not change requirements contracts routes authorization or expected results.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-WEB-SAFE-001-01
    assertion: "Replace fabricated emergency telephone details with the human-approved, accessible unavailable-configuration fallback and honest handover status."
  - id: AC-TASK-WEB-SAFE-001-02
    assertion: "Render only configured verified contacts, show approved fallback when absent, avoid claims that a human has received or will answer, make critical content perceivable without color, and update unit and journey assertions."
  - id: AC-TASK-WEB-SAFE-001-03
    assertion: Required failure keyboard and responsive states have reproducible evidence with no fabricated success or data.
  - id: AC-TASK-WEB-SAFE-001-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "corepack pnpm --dir apps/web test --run src/features/handover/HandoverPanel.test.tsx e2e/handover.spec.ts"
    expected_exit_code: 0
    proves: "Safety UI never invents contacts or human-response claims."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret destructive action or a change to a higher-authority artifact.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: true
  conflict_keys: ["redesign-safety-handover"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false

