schema_version: "1.1"
id: TASK-DOC-UX-004
phase: P00
title: "Prepare the accessibility baseline for approval"
status: accepted
objective: "Prepare a testable review-ready WCAG 2.2 AA accessibility baseline for all redesigned P0 journeys and shared components."
layer: governance
bounded_context: ux-accessibility
priority: P0
estimated_minutes: 30
sensitivity: medium
human_approval_required: true
approval_reasons: ["requirement_change"]
traceability:
  requirements: ["REQ-NF-A11Y-001"]
  acceptance_criteria: ["AC-REQ-NF-A11Y-001-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-A11Y-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-DOC-GOV-001"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/01-product/PRD.md", load: "full"}, {path: "docs/00-governance/DECISION_REGISTER.md", load: "full"}]
write_scope:
  allowed_paths: ["docs/03-ux/ACCESSIBILITY.md"]
  forbidden_paths: [apps/**, contracts/**, .git/**]
  max_files: 1
  max_added_lines: 400
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Set semantic, keyboard, focus, contrast, non-color, target-size, reduced-motion, screen-reader, 200-percent zoom and reflow expectations, including the WCAG inline-link exception and required manual evidence."
  - Prepare a review-ready accessibility baseline in the allowed path, retain testable manual and automated evidence requirements, and set document status to reviewed rather than approved.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-DOC-UX-004-01
    assertion: "A testable WCAG 2.2 AA baseline is ready for named human reviewers without claiming approval."
  - id: AC-TASK-DOC-UX-004-02
    assertion: "Set semantic, keyboard, focus, contrast, non-color, target-size, reduced-motion, screen-reader, 200-percent zoom and reflow expectations, including the WCAG inline-link exception and required manual evidence."
  - id: AC-TASK-DOC-UX-004-03
    assertion: The baseline covers keyboard focus semantics contrast target size reduced motion and 200 percent reflow and has status reviewed.
  - id: AC-TASK-DOC-UX-004-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "rg -n 'status: \"reviewed\"|UX-A11Y-|200 percent|keyboard' docs/03-ux/ACCESSIBILITY.md"
    expected_exit_code: 0
    proves: "The accessibility source is review-ready with testable keyboard and reflow rules and does not self-assert approval."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret or destructive action.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: false
  conflict_keys: ["ux-accessibility"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
