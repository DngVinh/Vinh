schema_version: "1.1"
id: TASK-AGENT-INJECT-001
phase: P04
title: "Isolate instructions from retrieved and tool-supplied content"
status: accepted
objective: "Prevent prompt injection by labeling trust domains, keeping retrieved or tool content out of instruction channels, and requiring policy validation for any proposed action."
layer: agent
bounded_context: "prompt-governance"
priority: P0
estimated_minutes: 45
sensitivity: critical
human_approval_required: true
approval_reasons: ["security_policy"]
traceability:
  requirements: []
  design: ["AI-SYS-001", "AI-SYS-007"]
  contracts: ["AI-PROMPT-ANSWER-001"]
  controls: ["AI-SYS-008", "AI-SYS-009", "SEC-CTRL-025"]
  evals: ["EVAL-RED-001", "THR-ABUSE-040"]
dependencies: ["TASK-AGENT-EVIDENCE-002", "TASK-AGENT-SAFETY-001"]
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - "services/api/src/campus247/agent/prompts/composer.py"
    - "services/api/src/campus247/agent/guardrails/prompt_injection.py"
    - "tests/unit/agent/test_prompt_injection.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 360
preconditions:
  - "Every dependency is accepted, every normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has preserved pre-existing changes and granted a non-overlapping write lease for this exact scope."
  - "Required security or privacy approval explicitly names this task and the proposed behavior."
steps:
  - "Read all inputs and enumerate state transitions, trust domains, invariants, failure modes, and forbidden side effects before coding."
  - "Tag system policy, developer configuration, user input, retrieved evidence, memory, and tool output as distinct trust domains."
  - "Escape and delimit untrusted content while ensuring it cannot add tools, permissions, goals, or execution directives."
  - "Detect and contain direct, indirect, encoded, multilingual, and tool-output injection patterns without logging raw sensitive prompts."
  - "Run verification, inspect the exact scoped diff and status, then emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-AGENT-INJECT-001-01
    assertion: "Retrieved text and tool output are always treated as data, never higher-priority instructions."
  - id: AC-TASK-AGENT-INJECT-001-02
    assertion: "Injection attempts cannot expand tools, authorization, data scope, or write capability."
  - id: AC-TASK-AGENT-INJECT-001-03
    assertion: "Benign quoted instructions remain answerable as content without disabling the guardrail."
  - id: AC-TASK-AGENT-INJECT-001-99
    assertion: "All behavior is deterministic under fakes, changes stay inside write_scope, and no secret, personal payload, hidden prompt, or chain-of-thought appears in evidence."
verification:
  - command: "python -B -m pytest -q tests/unit/agent/test_prompt_injection.py"
    expected_exit_code: 0
    proves: "Focused positive, adversarial, replay, concurrency, and failure-path behavior passes."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Catalog, DAG, traceability, approval, and scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands and exit codes", "acceptance-to-evidence mapping", "forbidden-side-effect counters and redaction proof"]
recovery:
  strategy: feature_disable
  steps:
    - "Disable only the new path behind the approved flag or apply a reviewed reverse patch; preserve trace and reconcile any reserved or result-unknown action."
stop_conditions:
  - "Normative AI, security, privacy, or contract sources conflict or leave the required transition undefined."
  - "A live provider, network call, credential, unapproved dependency, destructive operation, or unlisted file is required."
  - "The implementation cannot prove authorization, evidence grounding, bounded execution, idempotency, redaction, or safe failure."
parallelism:
  eligible: true
  conflict_keys: ["agent-prompt-boundary"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}

