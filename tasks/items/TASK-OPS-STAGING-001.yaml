schema_version: '1.0'
id: TASK-OPS-STAGING-001
phase: P09
title: Deploy release candidate to isolated synthetic staging
status: accepted
objective: Execute an approved staging deployment using only synthetic data and record immutable deployment and smoke evidence.
layer: release
bounded_context: staging-deploy
priority: P0
estimated_minutes: 30
sensitivity: high
human_approval_required: true
approval_reasons:
- paid_service
- security_policy
traceability:
  requirements: [REQ-NF-REL-001]
  acceptance_criteria: [AC-REQ-NF-REL-001-01]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design:
  - ARCH-005
  contracts: []
  controls:
  - SEC-SDLC-006
  evals: []
dependencies:
- TASK-INFRA-IAM-001
- TASK-INFRA-EDGE-001
- TASK-INFRA-MON-001
- TASK-TEST-RELEASE-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/06-security/13_SECURE_SDLC_GATES.md
  load: full
write_scope:
  allowed_paths:
  - release/staging-plan.yaml
  - release/staging-result.yaml
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 2
  max_added_lines: 160
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Execute an approved staging deployment using only synthetic data and record immutable deployment
  and smoke evidence.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-OPS-STAGING-001-01
  assertion: 'The deliverable satisfies the single objective: Execute an approved staging deployment using only synthetic
    data and record immutable deployment and smoke evidence.'
- id: AC-TASK-OPS-STAGING-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-OPS-STAGING-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q
  expected_exit_code: 0
  proves: The relevant automated regression suite passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: stop_before_promotion
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: false
  conflict_keys:
  - staging-deploy
execution_policy:
  max_fix_attempts: 2
  network_access: true
  paid_services: true
  destructive_operations: false
