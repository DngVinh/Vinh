schema_version: "1.1"
id: TASK-WEB-SCHED-003
phase: P06
title: "Make the schedule page fail honestly"
status: accepted
objective: "Replace schedule-page fabricated fallback data with explicit loading, retryable failure, stale or unavailable states."
layer: web
bounded_context: schedule-page-adapter
priority: P0
estimated_minutes: 30
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: ["REQ-NF-REL-004"]
  acceptance_criteria: ["AC-REQ-NF-REL-004-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-STATE-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-WEB-SCHED-002", "TASK-WEB-AUTH-002", "TASK-DOC-UX-002"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/03-ux/SYSTEM_STATES_AND_RECOVERY.md", load: "full"}, {path: "docs/01-product/PRD.md", load: "full"}]
write_scope:
