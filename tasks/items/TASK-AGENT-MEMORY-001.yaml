schema_version: '1.0'
id: TASK-AGENT-MEMORY-001
phase: P04
title: Build bounded conversation context manifest
status: accepted
objective: Implement build bounded conversation context manifest as one bounded, testable deliverable without changing upstream
  behavior.
layer: agent
bounded_context: memory
priority: P1
estimated_minutes: 30
sensitivity: high
human_approval_required: true
approval_reasons:
- security_policy
- legal_privacy
traceability:
  requirements: []
  design:
  - ARCH-004
  contracts:
  - ConversationSummary.v1
  controls:
  - PRIV-FLOW-015
  evals:
  - EVAL-DATA-MULTI-001
dependencies:
- TASK-AGENT-CHECKPOINT-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/05-ai/MEMORY_POLICY.md
  load: full
write_scope:
  allowed_paths:
  - services/api/src/campus247/application/conversation/context.py
  - tests/unit/conversation/test_context.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 2
  max_added_lines: 160
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Implement build bounded conversation context manifest as one bounded, testable deliverable
  without changing upstream behavior.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-AGENT-MEMORY-001-01
  assertion: 'The deliverable satisfies the single objective: Implement build bounded conversation context manifest as one
    bounded, testable deliverable without changing upstream behavior.'
- id: AC-TASK-AGENT-MEMORY-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-AGENT-MEMORY-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q tests/unit/conversation/test_context.py
  expected_exit_code: 0
  proves: The focused positive and failure-path behavior passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: reverse_patch
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: true
  conflict_keys:
  - memory-agent
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
