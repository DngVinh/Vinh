schema_version: "1.1"
id: TASK-EVAL-AUD-001
phase: P09
title: "Build adversarial release gates for AI safety and writes"
status: accepted
objective: "Create deterministic adversarial evaluations for grounding, injection, sensitive cases, confirmation, replay, idempotency, privacy, budget, and result-unknown behavior."
layer: eval
bounded_context: "ai-release-gates"
priority: P0
estimated_minutes: 45
sensitivity: high
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design: ["AI-SYS-001", "AI-SYS-007", "AI-SYS-012"]
  contracts: ["ActionPreview.v1", "GroundedDraft.v1"]
  controls: ["AI-SYS-005", "AI-SYS-008", "SEC-SDLC-008"]
  evals: ["EVAL-RED-001", "EVAL-RED-036", "EVAL-METRIC-010", "EVAL-METRIC-012"]
dependencies: ["TASK-AGENT-HITL-004", "TASK-WEB-CITE-003", "TASK-AGENT-INJECT-001", "TASK-AGENT-EGRESS-001", "TASK-AGENT-BUDGET-001", "TASK-AGENT-STREAM-001", "TASK-AGENT-TRACE-002"]
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - "evals/scenarios/audit_remediation.yaml"
    - "evals/runners/audit_remediation.py"
    - "tests/evals/test_audit_remediation_gate.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 360
preconditions:
  - "Every dependency is accepted, every normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has preserved pre-existing changes and granted a non-overlapping write lease for this exact scope."
  - "Required security or privacy approval explicitly names this task and the proposed behavior."
steps:
  - "Read all inputs and enumerate state transitions, trust domains, invariants, failure modes, and forbidden side effects before coding."
  - "Define reproducible scenarios with seeded fakes for direct and indirect injection, unsupported claims, sensitive escalation, and write attacks."
  - "Assert both expected response and forbidden side effects, including provider/tool call counts and audit evidence."
  - "Set explicit pass thresholds and emit machine-readable failures tied to task and control IDs."
  - "Run verification, inspect the exact scoped diff and status, then emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-EVAL-AUD-001-01
    assertion: "Every high-risk AI control has at least one positive and two adversarial scenarios."
  - id: AC-TASK-EVAL-AUD-001-02
    assertion: "Evaluation failures block release and identify the violated invariant without exposing sensitive fixture content."
  - id: AC-TASK-EVAL-AUD-001-03
    assertion: "The suite runs offline deterministically and makes no paid or live-provider calls."
  - id: AC-TASK-EVAL-AUD-001-99
    assertion: "All behavior is deterministic under fakes, changes stay inside write_scope, and no secret, personal payload, hidden prompt, or chain-of-thought appears in evidence."
verification:
  - command: "python -B -m pytest -q tests/evals/test_audit_remediation_gate.py"
    expected_exit_code: 0
    proves: "Focused positive, adversarial, replay, concurrency, and failure-path behavior passes."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Catalog, DAG, traceability, approval, and scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands and exit codes", "acceptance-to-evidence mapping", "forbidden-side-effect counters and redaction proof"]
recovery:
  strategy: feature_disable
  steps:
    - "Disable only the new path behind the approved flag or apply a reviewed reverse patch; preserve trace and reconcile any reserved or result-unknown action."
stop_conditions:
  - "Normative AI, security, privacy, or contract sources conflict or leave the required transition undefined."
  - "A live provider, network call, credential, unapproved dependency, destructive operation, or unlisted file is required."
  - "The implementation cannot prove authorization, evidence grounding, bounded execution, idempotency, redaction, or safe failure."
parallelism:
  eligible: true
  conflict_keys: ["ai-release-evals"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}

