schema_version: "1.1"
id: TASK-WEB-CHAT-003
phase: P06
title: "Rebuild the assistant conversation workspace"
status: accepted
objective: "Rebuild the assistant workspace for readable grounded conversations, clear capability limits and calm recovery while preserving actor-owned ordered turns."
layer: web
bounded_context: redesign-chat
priority: P0
estimated_minutes: 45
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: ["REQ-F-CHAT-001"]
  acceptance_criteria: ["AC-REQ-F-CHAT-001-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-SCR-CHAT-001", "UX-TRUST-001", "UX-A11Y-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-WEB-CHAT-001", "TASK-WEB-SHELL-002", "TASK-WEB-STATE-002", "TASK-WEB-AUTH-002", "TASK-DOC-UX-003"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/03-ux/SCREEN_INVENTORY.md", load: "full"}, {path: "docs/03-ux/TRUST_AND_CITATION_UX.md", load: "full"}]
write_scope:
  allowed_paths: ["apps/web/src/features/chat/ChatPanel.tsx", "apps/web/src/features/chat/ChatPanel.test.tsx"]
  forbidden_paths: [docs/**, contracts/**, .git/**]
  max_files: 2
  max_added_lines: 300
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Improve transcript hierarchy, composer affordances, streaming and validation states, retry and abstention behavior, keyboard flow and mobile layout; keep AI disclosure and source access visible without crowding every message."
  - Implement only the stated objective within the allowed paths and do not change requirements contracts routes authorization or expected results.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-WEB-CHAT-003-01
    assertion: "Rebuild the assistant workspace for readable grounded conversations, clear capability limits and calm recovery while preserving actor-owned ordered turns."
  - id: AC-TASK-WEB-CHAT-003-02
    assertion: "Improve transcript hierarchy, composer affordances, streaming and validation states, retry and abstention behavior, keyboard flow and mobile layout; keep AI disclosure and source access visible without crowding every message."
  - id: AC-TASK-WEB-CHAT-003-03
    assertion: Required failure keyboard and responsive states have reproducible evidence with no fabricated success or data.
  - id: AC-TASK-WEB-CHAT-003-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "corepack pnpm --dir apps/web test --run src/features/chat/ChatPanel.test.tsx"
    expected_exit_code: 0
    proves: "Conversation, keyboard and recovery behavior pass."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret destructive action or a change to a higher-authority artifact.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: true
  conflict_keys: ["redesign-chat"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false

