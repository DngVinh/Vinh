schema_version: "1.1"
id: TASK-API-HEALTHFIX-001
phase: P03
title: "Separate liveness, readiness, and dependency health truthfully"
status: accepted
objective: "Expose health endpoints whose status reflects process liveness, required dependency readiness, and optional degradation without leaking configuration or credentials."
layer: observability
bounded_context: "service-health"
priority: P1
estimated_minutes: 45
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design: ["ARCH-007"]
  contracts: ["API-OPS-001"]
  controls: ["SEC-CTRL-020"]
  evals: ["ARCH-CHECK-009"]
dependencies: ["TASK-DB-REPOFIX-001", "TASK-API-HEALTH-002"]
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - "services/api/src/campus247/presentation/health.py"
    - "services/api/src/campus247/bootstrap/app.py"
    - "tests/api/test_health_semantics.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 320
preconditions:
  - "Every dependency is accepted, each normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has verified a non-overlapping write lease and preserved the complete pre-existing Git state."
  - "Any required human approval names this task, its exact scope, and the current proposed security behavior."
steps:
  - "Read every input fully; map each normative MUST, failure state, and trust boundary to a testable implementation decision."
  - "Classify dependencies as required, optional, or externally gated and define bounded probe timeouts."
  - "Return liveness independent of dependencies and readiness false when a required dependency is unusable."
  - "Test timeouts, stale cached probes, optional degradation, startup, shutdown, and response redaction."
  - "Run verification in order, inspect the scoped diff and final status, and emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-API-HEALTHFIX-001-01
    assertion: "Liveness reports only whether the process can serve the health handler."
  - id: AC-TASK-API-HEALTHFIX-001-02
    assertion: "Readiness fails for unavailable required dependencies and never claims a fabricated ready state."
  - id: AC-TASK-API-HEALTHFIX-001-03
    assertion: "Health payloads expose stable component codes and no secrets, URLs, or stack traces."
  - id: AC-TASK-API-HEALTHFIX-001-99
    assertion: "The changed-file set stays inside write_scope and all logs, errors, fixtures, and evidence exclude secrets and unnecessary personal data."
verification:
  - command: "python -B -m pytest -q tests/api/test_health_semantics.py"
    expected_exit_code: 0
    proves: "Focused positive, adversarial, concurrency, and failure-path behavior passes deterministically."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Task catalog, dependency graph, traceability, approval, and write-scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands with exit codes and deterministic test output", "acceptance-criterion to evidence mapping", "negative-path and no-side-effect proof"]
recovery:
  strategy: reverse_patch
  steps:
    - "Stop promotion and apply a reviewed reverse patch limited to this task; preserve audit evidence and reconcile any result-unknown operation before retry."
stop_conditions:
  - "A normative source conflicts with another source, changed after review, or does not define the required security behavior."
  - "Completion needs an unlisted file, dependency, network call, live provider, credential, destructive operation, or broader policy change."
  - "Authorization, confirmation binding, idempotency, privacy, auditability, or failure atomicity cannot be proven by deterministic tests."
parallelism:
  eligible: true
  conflict_keys: ["api-health"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}

