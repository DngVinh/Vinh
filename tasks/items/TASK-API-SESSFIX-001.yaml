acceptance_criteria:
- assertion: A revoked session cannot authenticate any subsequent protected request.
  id: AC-TASK-API-SESSFIX-001-01
- assertion: Logout is idempotent and does not report success before revocation is
    durably recorded.
  id: AC-TASK-API-SESSFIX-001-02
- assertion: Audit events contain safe identifiers and outcome but no raw token or
    secret.
  id: AC-TASK-API-SESSFIX-001-03
- assertion: The changed-file set stays inside write_scope and all logs, errors, fixtures,
    and evidence exclude secrets and unnecessary personal data.
  id: AC-TASK-API-SESSFIX-001-99
approval_reasons:
- authentication
- security_policy
bounded_context: identity
dependencies:
- TASK-API-AUTHFIX-001
estimated_minutes: 45
evidence_required:
- initial and final git status
- exact changed-file and diff summary
- commands with exit codes and deterministic test output
- acceptance-criterion to evidence mapping
- negative-path and no-side-effect proof
execution_policy:
  destructive_operations: false
  max_fix_attempts: 2
  network_access: false
  paid_services: false
human_approval_required: true
id: TASK-API-SESSFIX-001
inputs:
- load: full
  path: docs/00-governance/DOCUMENT_CONTROL.md
layer: api
objective: Implement server-side session revocation so logout and credential rotation
  invalidate all relevant artifacts without leaving reusable bearer or refresh state.
parallelism:
  conflict_keys:
  - api-session-revocation
  eligible: true
phase: P03
preconditions:
- Every dependency is accepted, each normative input is approved, and this draft task
  has passed readiness review.
- The orchestrator has verified a non-overlapping write lease and preserved the complete
  pre-existing Git state.
- Any required human approval names this task, its exact scope, and the current proposed
  security behavior.
priority: P0
recovery:
  steps:
  - Stop promotion and apply a reviewed reverse patch limited to this task; preserve
    audit evidence and reconcile any result-unknown operation before retry.
  strategy: reverse_patch
schema_version: '1.1'
sensitivity: critical
status: accepted
steps:
- Read every input fully; map each normative MUST, failure state, and trust boundary
  to a testable implementation decision.
- Define revocation semantics for access, refresh, cookie, and server-side session
  identifiers.
- Make logout idempotently revoke server state before returning and rotate/revoke
  on credential events.
- Test replay after logout, concurrent logout, already-revoked state, and backend
  failure without false success.
- Run verification in order, inspect the scoped diff and final status, and emit schema-valid
  acceptance-to-evidence mapping.
stop_conditions:
- A normative source conflicts with another source, changed after review, or does
  not define the required security behavior.
- Completion needs an unlisted file, dependency, network call, live provider, credential,
  destructive operation, or broader policy change.
- Authorization, confirmation binding, idempotency, privacy, auditability, or failure
  atomicity cannot be proven by deterministic tests.
title: Revoke sessions completely on logout and credential rotation
traceability:
  contracts:
  - INT-IDP-001
  controls:
  - SEC-AUTHN-002
  - SEC-AUTHN-003
  - SEC-AUDIT-001
  design:
  - ADR-015
  evals:
  - THR-ABUSE-001
  requirements: []
verification:
- command: python -B -m pytest -q tests/api/test_session_revocation.py
  expected_exit_code: 0
  proves: Focused positive, adversarial, concurrency, and failure-path behavior passes
    deterministically.
- command: python -B tasks/tools/validate_catalog.py
  expected_exit_code: 0
  proves: Task catalog, dependency graph, traceability, approval, and write-scope
    invariants remain valid.
write_scope:
  allowed_paths:
  - services/api/src/campus247/presentation/identity.py
  - services/api/src/campus247/application/identity/session_service.py
  - tests/api/test_session_revocation.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_added_lines: 320
  max_files: 3
