schema_version: '1.0'
id: TASK-OPS-POSTREL-001
phase: P09
title: Verify post-release controls and rollback readiness
status: accepted
objective: Implement verify post-release controls and rollback readiness as one bounded, testable deliverable without changing
  upstream behavior.
layer: release
bounded_context: production-deploy
priority: P0
estimated_minutes: 30
sensitivity: critical
human_approval_required: true
approval_reasons:
- production_deploy
- security_policy
traceability:
  requirements: []
  design:
  - ARCH-009
  contracts: []
  controls:
  - SEC-SDLC-008
  evals: []
dependencies:
- TASK-OPS-PROD-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/06-security/13_SECURE_SDLC_GATES.md
  load: full
write_scope:
  allowed_paths:
  - release/post-release-verification.yaml
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 1
  max_added_lines: 160
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Implement verify post-release controls and rollback readiness as one bounded, testable deliverable
  without changing upstream behavior.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-OPS-POSTREL-001-01
  assertion: 'The deliverable satisfies the single objective: Implement verify post-release controls and rollback readiness
    as one bounded, testable deliverable without changing upstream behavior.'
- id: AC-TASK-OPS-POSTREL-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-OPS-POSTREL-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q
  expected_exit_code: 0
  proves: The relevant automated regression suite passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: stop_before_promotion
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: false
  conflict_keys:
  - production-deploy
execution_policy:
  max_fix_attempts: 2
  network_access: true
  paid_services: true
  destructive_operations: false
