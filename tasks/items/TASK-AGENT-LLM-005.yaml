- 'Implement only this objective: Implement the disabled-by-default DeepSeek adapter using approved synthetic fixtures and
  contract tests; do not perform a live call.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-AGENT-LLM-005-01
