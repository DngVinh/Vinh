schema_version: "1.1"
id: TASK-GOV-AUD-003
phase: P00
title: "Add canonical remediation requirement bindings for output compliance"
status: accepted
objective: "Create approved REQ-NF-REM-* requirement entries and AC-REQ-NF-REM-* acceptance criteria in the canonical bindings file so every remediation task can produce schema-valid output traceability."
layer: governance
bounded_context: "task-governance"
priority: P0
estimated_minutes: 45
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  coverage_binding_ref: "tasks/requirement-acceptance-bindings.yaml"
  binding_mode: "direct"
  design: ["ARCH-009"]
  contracts: []
  controls: ["SEC-SDLC-002"]
  evals: []
dependencies: []
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - "tasks/requirement-acceptance-bindings.yaml"
    - "tasks/traceability-registry.yaml"
    - "tests/delivery/test_remediation_bindings.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 400
preconditions:
  - "Every dependency is accepted, each normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has verified a non-overlapping write lease and preserved the complete pre-existing Git state."
steps:
  - "Read task-output.schema.json and identify the exact requirement_id and acceptance_criteria patterns required."
  - "Create REQ-NF-REM-001 through REQ-NF-REM-010 grouping remediation tasks by audit finding domain."
  - "Create corresponding AC-REQ-NF-REM-*-01 entries mapping each remediation task to its requirement."
  - "Add a test that validates every remediation task ID appears in at least one binding with correct format."
  - "Run verification in order and emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-GOV-AUD-003-01
    assertion: "Every remediation task ID maps to at least one REQ-NF-REM-* requirement with a valid AC-REQ-NF-REM-* criterion."
  - id: AC-TASK-GOV-AUD-003-02
    assertion: "All requirement IDs and AC IDs match task-output.schema.json patterns exactly."
  - id: AC-TASK-GOV-AUD-003-03
    assertion: "Existing canonical bindings are preserved unchanged."
  - id: AC-TASK-GOV-AUD-003-99
    assertion: "The changed-file set stays inside write_scope and all logs, errors, fixtures, and evidence exclude secrets and unnecessary personal data."
verification:
  - command: "python -B -m pytest -q tests/delivery/test_remediation_bindings.py"
    expected_exit_code: 0
    proves: "Every remediation task has a valid canonical binding."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Task catalog, dependency graph, traceability, approval, and write-scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands with exit codes and deterministic test output", "acceptance-criterion to evidence mapping"]
recovery:
  strategy: reverse_patch
  steps:
    - "Stop promotion and apply a reviewed reverse patch limited to this task; preserve audit evidence."
stop_conditions:
  - "A normative source conflicts with another source or does not define the required behavior."
  - "Completion needs an unlisted file, dependency, network call, credential, or destructive operation."
parallelism:
  eligible: true
  conflict_keys: ["remediation-bindings"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}
