schema_version: "1.1"
id: TASK-TEST-CI-002
phase: P09
title: "Make CI enforce catalog security AI and release gates"
status: accepted
objective: "Wire deterministic catalog, unit, integration, web, security, AI evaluation, and release-manifest checks into required CI jobs with explicit failure evidence."
layer: test
bounded_context: "continuous-integration"
priority: P0
estimated_minutes: 45
sensitivity: high
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design: ["ARCH-009"]
  contracts: []
  controls: ["SEC-SDLC-002", "SEC-SDLC-003", "SEC-SDLC-008"]
  evals: ["ARCH-CHECK-009", "EVAL-RED-001"]
dependencies: ["TASK-OPS-RELEASE-002"]
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - ".github/workflows/ci.yml"
    - "scripts/verify_ci_contract.py"
    - "tests/delivery/test_ci_contract.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 360
preconditions:
  - "Every dependency is accepted, every normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has preserved all existing work and granted a non-overlapping write lease for this exact scope."
  - "Required human approval names this task, scope, environment, and proposed security or privacy behavior."
steps:
  - "Read all inputs and enumerate user states, trust boundaries, authoritative data, failure modes, and forbidden claims before coding."
  - "Declare required jobs, dependency order, timeouts, offline fakes, artifact retention, and failure summaries."
  - "Prevent allow-failure, skipped critical suites, unpinned actions, or branch-only omissions for release gates."
  - "Validate workflow semantics with an offline contract test."
  - "Run verification, inspect exact scoped diff and status, and emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-TEST-CI-002-01
    assertion: "Every critical remediation gate is required and failure-propagating."
  - id: AC-TASK-TEST-CI-002-02
    assertion: "CI uses no live provider, paid service, real secret, or production data."
  - id: AC-TASK-TEST-CI-002-03
    assertion: "Gate evidence identifies command, revision, exit code, and artifact digest."
  - id: AC-TASK-TEST-CI-002-99
    assertion: "Changes remain inside write_scope; tests cover loading, empty, denied, degraded, failure, retry, and recovery as applicable without secrets or personal data."
verification:
  - command: "python -B -m pytest -q tests/delivery/test_ci_contract.py"
    expected_exit_code: 0
    proves: "Focused positive, authorization, degraded, adversarial, and failure-path behavior passes."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Catalog, DAG, traceability, approval, and scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands and exit codes", "acceptance-to-evidence mapping", "negative-state screenshots or structured test evidence"]
recovery:
  strategy: stop_before_promotion
  steps:
    - "Keep the change unpromoted and apply a reviewed reverse patch limited to this scope if needed; preserve evidence and reconcile ambiguous writes."
stop_conditions:
  - "Normative product, UX, security, privacy, or architecture sources conflict or leave the required behavior undefined."
  - "An unlisted file, dependency, network call, credential, live service, production access, or destructive operation is required."
  - "Authorization, source truth, accessibility, safe retry, evidence, or rollback cannot be verified deterministically."
parallelism:
  eligible: true
  conflict_keys: ["ci-contract"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}

