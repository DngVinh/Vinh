  design:
  - DEC-014
  contracts:
  - TOOL-SCHEDULE-001
  - TOOL-HITL-001
  controls:
  - SEC-CTRL-007
  evals:
  - EVAL-DATA-TOOL-001
dependencies:
- TASK-AGENT-STATE-001
- TASK-API-POLICY-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
