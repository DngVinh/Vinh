schema_version: '1.0'
id: TASK-TEST-OPENAPI-001
phase: P02
title: Validate OpenAPI and referenced schemas
status: accepted
objective: Implement validate openapi and referenced schemas as one bounded, testable deliverable without changing upstream
  behavior.
layer: test
bounded_context: contracts
priority: P0
estimated_minutes: 30
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design:
  - ARCH-CHECK-004
  contracts:
  - API-BASE-002
  controls: []
  evals: []
dependencies:
- TASK-TEST-SCHEMA-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/04-architecture/contracts/README.md
  load: full
write_scope:
  allowed_paths:
  - tests/contracts/test_openapi.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 1
  max_added_lines: 160
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Implement validate openapi and referenced schemas as one bounded, testable deliverable without
  changing upstream behavior.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-TEST-OPENAPI-001-01
  assertion: 'The deliverable satisfies the single objective: Implement validate openapi and referenced schemas as one bounded,
    testable deliverable without changing upstream behavior.'
- id: AC-TASK-TEST-OPENAPI-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-TEST-OPENAPI-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q tests/contracts/test_openapi.py
  expected_exit_code: 0
  proves: The focused positive and failure-path behavior passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: reverse_patch
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: true
  conflict_keys:
  - contracts-test
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
