schema_version: "1.1"
id: TASK-DOC-UX-002
phase: P00
title: "Prepare interaction and recovery states for approval"
status: accepted
objective: "Prepare one review-ready interaction and state model that prevents fabricated success and gives every redesigned journey an explicit recovery path."
layer: governance
bounded_context: ux-state-model
priority: P0
estimated_minutes: 45
sensitivity: medium
human_approval_required: true
approval_reasons: ["requirement_change"]
traceability:
  requirements: ["REQ-NF-REL-004"]
  acceptance_criteria: ["AC-REQ-NF-REL-004-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-STATE-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-DOC-GOV-001"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/01-product/PRD.md", load: "full"}, {path: "docs/00-governance/DECISION_REGISTER.md", load: "full"}]
write_scope:
  allowed_paths: ["docs/03-ux/INTERACTION_SPECIFICATIONS.md", "docs/03-ux/SYSTEM_STATES_AND_RECOVERY.md", "docs/03-ux/UI_STATE_MATRIX.yaml"]
  forbidden_paths: [apps/**, contracts/**, .git/**]
  max_files: 3
  max_added_lines: 400
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Specify keyboard and focus behavior, form and drawer behavior, loading, empty, stale, offline, unauthorized, degraded, failed-with-no-effect and result-unknown states; align the state matrix with every P0 screen."
  - Prepare review-ready state content in the allowed paths, reconcile the matrix with the prose, and set document status to reviewed rather than approved.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-DOC-UX-002-01
    assertion: "The interaction and state model is internally consistent and ready for named human reviewers without claiming approval."
  - id: AC-TASK-DOC-UX-002-02
    assertion: "Specify keyboard and focus behavior, form and drawer behavior, loading, empty, stale, offline, unauthorized, degraded, failed-with-no-effect and result-unknown states; align the state matrix with every P0 screen."
  - id: AC-TASK-DOC-UX-002-03
    assertion: The prose and state matrix cover every named P0 journey with explicit non-success and recovery outcomes and have status reviewed.
  - id: AC-TASK-DOC-UX-002-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "rg -n 'status: \"reviewed\"|UX-STATE-|result unknown|no effect' docs/03-ux/INTERACTION_SPECIFICATIONS.md docs/03-ux/SYSTEM_STATES_AND_RECOVERY.md docs/03-ux/UI_STATE_MATRIX.yaml"
    expected_exit_code: 0
    proves: "The state sources are review-ready and contain explicit non-success outcomes without self-asserting approval."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret or destructive action.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: false
  conflict_keys: ["ux-state-model"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
