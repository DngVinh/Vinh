schema_version: '1.0'
id: TASK-EVAL-GATE-001
phase: P07
title: Implement hard-zero and threshold regression gate
status: accepted
objective: Implement implement hard-zero and threshold regression gate as one bounded, testable deliverable without changing
  upstream behavior.
layer: eval
bounded_context: evaluation
priority: P0
estimated_minutes: 30
sensitivity: high
human_approval_required: true
approval_reasons:
- security_policy
traceability:
  requirements: []
  design:
  - ARCH-CHECK-008
  contracts: []
  controls:
  - SEC-SDLC-005
  evals:
  - EVAL-METRIC-009
  - EVAL-METRIC-015
dependencies:
- TASK-EVAL-RUNNER-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/05-ai/EVALUATION_PLAN.md
  load: full
write_scope:
  allowed_paths:
  - packages/evals/src/gates.py
  - packages/evals/tests/test_gates.py
  - packages/evals/gates/v1.yaml
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 3
  max_added_lines: 220
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Implement implement hard-zero and threshold regression gate as one bounded, testable deliverable
  without changing upstream behavior.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-EVAL-GATE-001-01
  assertion: 'The deliverable satisfies the single objective: Implement implement hard-zero and threshold regression gate
    as one bounded, testable deliverable without changing upstream behavior.'
- id: AC-TASK-EVAL-GATE-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-EVAL-GATE-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q packages/evals/tests/test_gates.py
  expected_exit_code: 0
  proves: The focused positive and failure-path behavior passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: reverse_patch
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: true
  conflict_keys:
  - evaluation-eval
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
