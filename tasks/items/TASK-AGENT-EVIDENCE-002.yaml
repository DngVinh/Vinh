schema_version: "1.1"
id: TASK-AGENT-EVIDENCE-002
phase: P04
title: "Require claim-level evidence and abstention before answers"
status: accepted
objective: "Build a deterministic evidence gate that maps material answer claims to authorized sources and forces qualification or abstention when support is missing, stale, or contradictory."
layer: agent
bounded_context: "grounded-answering"
priority: P0
estimated_minutes: 45
sensitivity: high
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design: ["AI-SYS-001", "AI-SYS-012"]
  contracts: ["GroundedDraft.v1", "Citation.v1"]
  controls: ["AI-SYS-001", "AI-SYS-002", "AI-SYS-006"]
  evals: ["EVAL-DATA-ABSTAIN-001", "EVAL-METRIC-001", "RAG-EVAL-001"]
dependencies: ["TASK-AGENT-RAG-001"]
inputs:
  - path: "docs/00-governance/DOCUMENT_CONTROL.md"
    load: full
write_scope:
  allowed_paths:
    - "services/api/src/campus247/agent/grounding/evidence_gate.py"
    - "services/api/src/campus247/agent/state.py"
    - "tests/unit/agent/test_evidence_gate.py"
  forbidden_paths: ["docs/**", "contracts/**", ".git/**"]
  max_files: 3
  max_added_lines: 360
preconditions:
  - "Every dependency is accepted, every normative input is approved, and this draft task has passed readiness review."
  - "The orchestrator has preserved pre-existing changes and granted a non-overlapping write lease for this exact scope."
  - "Required security or privacy approval explicitly names this task and the proposed behavior."
steps:
  - "Read all inputs and enumerate state transitions, trust domains, invariants, failure modes, and forbidden side effects before coding."
  - "Extract material claims and bind each to retrievable source spans, authorization scope, freshness, and contradiction state."
  - "Apply deterministic support thresholds by claim risk rather than accepting model self-assessment."
  - "Return grounded, qualified, clarify, or abstain decisions with machine-checkable reasons."
  - "Run verification, inspect the exact scoped diff and status, then emit schema-valid acceptance-to-evidence mapping."
acceptance_criteria:
  - id: AC-TASK-AGENT-EVIDENCE-002-01
    assertion: "Every material factual claim in a grounded answer has at least one authorized supporting citation."
  - id: AC-TASK-AGENT-EVIDENCE-002-02
    assertion: "Missing, stale, inaccessible, or contradictory evidence cannot yield an unqualified answer."
  - id: AC-TASK-AGENT-EVIDENCE-002-03
    assertion: "The gate is deterministic for fixed inputs and its decision is independently testable."
  - id: AC-TASK-AGENT-EVIDENCE-002-99
    assertion: "All behavior is deterministic under fakes, changes stay inside write_scope, and no secret, personal payload, hidden prompt, or chain-of-thought appears in evidence."
verification:
  - command: "python -B -m pytest -q tests/unit/agent/test_evidence_gate.py"
    expected_exit_code: 0
    proves: "Focused positive, adversarial, replay, concurrency, and failure-path behavior passes."
  - command: "python -B tasks/tools/validate_catalog.py"
    expected_exit_code: 0
    proves: "Catalog, DAG, traceability, approval, and scope invariants remain valid."
evidence_required: ["initial and final git status", "exact changed-file and diff summary", "commands and exit codes", "acceptance-to-evidence mapping", "forbidden-side-effect counters and redaction proof"]
recovery:
  strategy: feature_disable
  steps:
    - "Disable only the new path behind the approved flag or apply a reviewed reverse patch; preserve trace and reconcile any reserved or result-unknown action."
stop_conditions:
  - "Normative AI, security, privacy, or contract sources conflict or leave the required transition undefined."
  - "A live provider, network call, credential, unapproved dependency, destructive operation, or unlisted file is required."
  - "The implementation cannot prove authorization, evidence grounding, bounded execution, idempotency, redaction, or safe failure."
parallelism:
  eligible: true
  conflict_keys: ["agent-evidence-gate"]
execution_policy: {max_fix_attempts: 2, network_access: false, paid_services: false, destructive_operations: false}

