schema_version: "1.1"
id: TASK-WEB-ROOM-003
phase: P06
title: "Make the room request page fail honestly"
status: draft
objective: "Remove room-page synthetic success behavior and show authoritative failed, unknown or confirmed outcomes."
layer: web
bounded_context: room-page-adapter
priority: P0
estimated_minutes: 30
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: ["REQ-NF-REL-004"]
  acceptance_criteria: ["AC-REQ-NF-REL-004-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-STATE-001", "UX-ACT-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-WEB-ROOM-002", "TASK-WEB-AUTH-002", "TASK-DOC-UX-002"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/03-ux/SYSTEM_STATES_AND_RECOVERY.md", load: "full"}, {path: "docs/03-ux/ACTION_PREVIEW_AND_CONFIRMATION_UX.md", load: "full"}]
write_scope:
  allowed_paths: ["apps/web/src/app/rooms/page.tsx", "apps/web/src/app/rooms/page.test.tsx"]
  forbidden_paths: [docs/**, contracts/**, .git/**]
  max_files: 2
  max_added_lines: 300
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Create no receipt before an authoritative response, preserve the confirmation binding, represent timeouts as result unknown, prevent duplicate retry and test that API failure cannot render a successful booking."
  - Implement only the stated objective within the allowed paths and do not change requirements contracts routes authorization or expected results.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-WEB-ROOM-003-01
    assertion: "Remove room-page synthetic success behavior and show authoritative failed, unknown or confirmed outcomes."
  - id: AC-TASK-WEB-ROOM-003-02
    assertion: "Create no receipt before an authoritative response, preserve the confirmation binding, represent timeouts as result unknown, prevent duplicate retry and test that API failure cannot render a successful booking."
  - id: AC-TASK-WEB-ROOM-003-03
    assertion: Required failure keyboard and responsive states have reproducible evidence with no fabricated success or data.
  - id: AC-TASK-WEB-ROOM-003-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "corepack pnpm --dir apps/web test --run src/app/rooms/page.test.tsx"
    expected_exit_code: 0
    proves: "Room failures and timeouts cannot fabricate a booking."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret destructive action or a change to a higher-authority artifact.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: true
  conflict_keys: ["room-page-adapter"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false

