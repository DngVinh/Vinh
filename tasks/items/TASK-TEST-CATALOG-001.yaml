schema_version: '1.0'
id: TASK-TEST-CATALOG-001
phase: P00
title: Wire task catalog validation into preflight
status: accepted
objective: Provide a platform-neutral preflight wrapper and regression test for the task catalog validator.
layer: test
bounded_context: delivery-governance
priority: P0
estimated_minutes: 25
sensitivity: medium
human_approval_required: false
approval_reasons: []
traceability:
  requirements: []
  design:
  - ARCH-009
  contracts: []
  controls:
  - SEC-SDLC-003
  evals: []
dependencies:
- TASK-REPO-SCAFFOLD-001
inputs:
- path: docs/00-governance/DOCUMENT_CONTROL.md
  load: full
- path: docs/09-agent-execution/VERIFICATION_EVIDENCE_PROTOCOL.md
  load: full
write_scope:
  allowed_paths:
  - scripts/validate-tasks.ps1
  - tests/delivery/test_task_catalog.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_files: 2
  max_added_lines: 160
preconditions:
- Every dependency is accepted and every normative input is approved for this environment.
- The orchestrator has confirmed a clean, non-overlapping write lease for this task.
steps:
- Read every input and inspect the nearest existing implementation and test pattern.
- 'Implement only this objective: Provide a platform-neutral preflight wrapper and regression test for the task catalog validator.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-TEST-CATALOG-001-01
  assertion: 'The deliverable satisfies the single objective: Provide a platform-neutral preflight wrapper and regression
    test for the task catalog validator.'
- id: AC-TASK-TEST-CATALOG-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-TEST-CATALOG-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q tests/delivery/test_task_catalog.py
  expected_exit_code: 0
  proves: The focused positive and failure-path behavior passes.
evidence_required:
- initial and final git status
- changed-file and diff summary
- commands with exit codes
- acceptance-to-evidence mapping
recovery:
  strategy: reverse_patch
  steps:
  - Keep the change unpromoted and apply a reviewed reverse patch limited to this task if rollback is required.
stop_conditions:
- A required source is missing, conflicting, changed after review or not approved.
- Completion requires an unlisted file, dependency, network call, secret or destructive operation.
- A required human approval is absent, expired or does not name this task and scope.
parallelism:
  eligible: true
  conflict_keys:
  - delivery-tests
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
