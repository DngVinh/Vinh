- 'Implement only this objective: Implement script isolated postgresql restore verification as one bounded, testable deliverable
  without changing upstream behavior.'
- Add or update the focused positive and failure-path verification within the allowed scope.
- Run every verification command, inspect the scoped diff, and emit schema-valid evidence.
acceptance_criteria:
- id: AC-TASK-OPS-RESTORE-001-01
  assertion: 'The deliverable satisfies the single objective: Implement script isolated postgresql restore verification as
    one bounded, testable deliverable without changing upstream behavior.'
- id: AC-TASK-OPS-RESTORE-001-02
  assertion: The focused failure or negative path is verified and causes no unauthorized side effect.
- id: AC-TASK-OPS-RESTORE-001-03
  assertion: The final changed-file set is fully contained by the declared write scope.
verification:
- command: python -m pytest -q tests/operations/test_restore_script.py
