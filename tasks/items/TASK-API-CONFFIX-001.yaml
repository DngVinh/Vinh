acceptance_criteria:
- assertion: Changing any bound field invalidates confirmation before side effects.
  id: AC-TASK-API-CONFFIX-001-01
- assertion: Exactly one concurrent consumer can reserve a confirmation token.
  id: AC-TASK-API-CONFFIX-001-02
- assertion: Expired, replayed, malformed, or wrong-subject confirmations produce
    no write.
  id: AC-TASK-API-CONFFIX-001-03
- assertion: The changed-file set stays inside write_scope and all logs, errors, fixtures,
    and evidence exclude secrets and unnecessary personal data.
  id: AC-TASK-API-CONFFIX-001-99
approval_reasons:
- authorization
- security_policy
- cryptography
bounded_context: controlled-actions
dependencies:
- TASK-API-WRITEFIX-001
estimated_minutes: 45
evidence_required:
- initial and final git status
- exact changed-file and diff summary
- commands with exit codes and deterministic test output
- acceptance-criterion to evidence mapping
- negative-path and no-side-effect proof
execution_policy:
  destructive_operations: false
  max_fix_attempts: 2
  network_access: false
  paid_services: false
human_approval_required: true
id: TASK-API-CONFFIX-001
inputs:
- load: full
  path: docs/00-governance/DOCUMENT_CONTROL.md
layer: application
objective: Bind confirmations cryptographically or deterministically to actor, action,
  canonical payload, preview version, expiry, and one-time execution reservation.
parallelism:
  conflict_keys:
  - action-confirmation
  eligible: true
phase: P03
preconditions:
- Every dependency is accepted, each normative input is approved, and this draft task
  has passed readiness review.
- The orchestrator has verified a non-overlapping write lease and preserved the complete
  pre-existing Git state.
- Any required human approval names this task, its exact scope, and the current proposed
  security behavior.
priority: P0
recovery:
  steps:
  - Stop promotion and apply a reviewed reverse patch limited to this task; preserve
    audit evidence and reconcile any result-unknown operation before retry.
  strategy: reverse_patch
schema_version: '1.1'
sensitivity: critical
status: accepted
steps:
- Read every input fully; map each normative MUST, failure state, and trust boundary
  to a testable implementation decision.
- Canonicalize the approved action payload and calculate the confirmation binding
  from actor, scope, action, payload, version, and expiry.
- Atomically reserve a valid confirmation before dispatch and reject mismatch, expiry,
  replay, or concurrent reuse.
- Return explicit failed-no-effect or result-unknown states instead of inferring success.
- Run verification in order, inspect the scoped diff and final status, and emit schema-valid
  acceptance-to-evidence mapping.
stop_conditions:
- A normative source conflicts with another source, changed after review, or does
  not define the required security behavior.
- Completion needs an unlisted file, dependency, network call, live provider, credential,
  destructive operation, or broader policy change.
- Authorization, confirmation binding, idempotency, privacy, auditability, or failure
  atomicity cannot be proven by deterministic tests.
title: Make confirmation tokens subject and payload bound
traceability:
  contracts:
  - ActionPreview.v1
  - API-IDEM-007
  controls:
  - SEC-AUTHZ-003
  - SEC-CRYPTO-003
  - SEC-CTRL-008
  design:
  - ADR-016
  evals:
  - EVAL-METRIC-010
  requirements: []
verification:
- command: python -B -m pytest -q tests/unit/actions/test_confirmation_binding.py
  expected_exit_code: 0
  proves: Focused positive, adversarial, concurrency, and failure-path behavior passes
    deterministically.
- command: python -B tasks/tools/validate_catalog.py
  expected_exit_code: 0
  proves: Task catalog, dependency graph, traceability, approval, and write-scope
    invariants remain valid.
write_scope:
  allowed_paths:
  - services/api/src/campus247/domain/actions/confirmation.py
  - services/api/src/campus247/application/actions/confirm.py
  - tests/unit/actions/test_confirmation_binding.py
  forbidden_paths:
  - docs/**
  - contracts/**
  - .git/**
  max_added_lines: 320
  max_files: 3
