schema_version: "1.1"
id: TASK-DOC-UX-001
phase: P00
title: "Prepare the redesigned information architecture for approval"
status: accepted
objective: "Prepare a coherent review-ready route, navigation, role and screen baseline without changing approved product capabilities or self-approving normative content."
layer: governance
bounded_context: ux-foundations
priority: P0
estimated_minutes: 45
sensitivity: medium
human_approval_required: true
approval_reasons: ["requirement_change", "architecture_change"]
traceability:
  requirements: ["REQ-F-GOV-001"]
  acceptance_criteria: ["AC-REQ-F-GOV-001-01"]
  coverage_binding_ref: tasks/requirement-acceptance-bindings.yaml
  binding_mode: direct
  design: ["UX-IA-001"]
  contracts: []
  controls: []
  evals: []
dependencies: ["TASK-DOC-GOV-001"]
inputs: [{path: "docs/00-governance/DOCUMENT_CONTROL.md", load: "full"}, {path: "docs/01-product/PRD.md", load: "full"}, {path: "docs/00-governance/DECISION_REGISTER.md", load: "full"}]
write_scope:
  allowed_paths: ["docs/03-ux/README.md", "docs/03-ux/INFORMATION_ARCHITECTURE.md", "docs/03-ux/SCREEN_INVENTORY.md"]
  forbidden_paths: [apps/**, contracts/**, .git/**]
  max_files: 3
  max_added_lines: 400
preconditions:
  - Every dependency is accepted and every normative input is approved for this environment.
  - The assigned task status is ready and any required human approval names this task and exact scope.
  - The orchestrator confirmed a clean non-overlapping write lease and the executor preserved all pre-existing workspace changes.
steps:
  - Read every input and each existing allowed target before editing.
  - "Reconcile current routes with the proposed student, staff, knowledge and operations workspaces; define role visibility, responsive navigation, deep links, simulation disclosure and every screen responsibility."
  - Prepare review-ready content in the allowed paths, preserve current routes unless an approved decision changes them, and set document status to reviewed rather than approved.
  - Add or update focused positive keyboard responsive and failure-path evidence that fits this objective.
  - Run every verification command in order then inspect git status and the exact changed-file set.
  - Return one JSON object conforming to tasks/task-output.schema.json with acceptance-to-evidence mapping.
acceptance_criteria:
  - id: AC-TASK-DOC-UX-001-01
    assertion: "The route, navigation, role and screen baseline is internally consistent and ready for named human reviewers without claiming approval."
  - id: AC-TASK-DOC-UX-001-02
    assertion: "Reconcile current routes with the proposed student, staff, knowledge and operations workspaces; define role visibility, responsive navigation, deep links, simulation disclosure and every screen responsibility."
  - id: AC-TASK-DOC-UX-001-03
    assertion: All three documents have status reviewed and record current route compatibility, responsive navigation and unresolved approval questions.
  - id: AC-TASK-DOC-UX-001-04
    assertion: Every changed file is inside the declared scope and no unrelated workspace state was altered.
verification:
  - command: "rg -n 'status: \"reviewed\"|UX-IA-|UX-SCR-' docs/03-ux/README.md docs/03-ux/INFORMATION_ARCHITECTURE.md docs/03-ux/SCREEN_INVENTORY.md"
    expected_exit_code: 0
    proves: "The foundation is review-ready with stable UX identifiers and does not self-assert approval."
evidence_required:
  - initial and final git status
  - changed-file and diff summary
  - commands with exit codes
  - acceptance-to-evidence mapping
  - browser or manual evidence marked not_verified when unavailable
recovery:
  strategy: reverse_patch
  steps:
    - Keep the patch unpromoted and apply only a reviewed task-scoped reverse patch if rollback is required.
stop_conditions:
  - A required source is missing conflicting changed after approval or not approved.
  - Completion needs an unlisted file dependency network call secret or destructive action.
  - Visual or browser claims cannot be reproduced in the available environment.
parallelism:
  eligible: false
  conflict_keys: ["ux-foundations"]
execution_policy:
  max_fix_attempts: 2
  network_access: false
  paid_services: false
  destructive_operations: false
