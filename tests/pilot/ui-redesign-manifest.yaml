      - viewport: "VP-MOBILE"
        outcome: "pass"
        artifact: "release/evidence/screenshots/chrome_dashboard_mobile_360px.png"
        observation: "Verified reflow at 360px without horizontal overflow; cards stack vertically."
      - viewport: "VP-TABLET"
        outcome: "pass"
        artifact: "release/evidence/screenshots/chrome_dashboard_tablet_768px.png"
        observation: "Verified responsive 2-column layout at 768px."
      - viewport: "VP-DESKTOP"
        outcome: "pass"
