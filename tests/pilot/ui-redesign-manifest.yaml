        evidence: "No color-only status indicators. All states use text labels."
      - check: "CHK-SEMANTICS"
        outcome: "pass"
        evidence: "Semantic h1, navigation landmarks, skip-link, and role='main'."
      - check: "CHK-STATUS"
        outcome: "pass"
        evidence: "AsyncState component provides loading/error/empty states via role='status' and role='alert'."

