schema_version: "1.0"
suite: "ui_redesign_browser_evidence"
task_id: "TASK-TEST-WEB-002"
environment: "synthetic-pilot"
conformance_target: "WCAG 2.2 AA"
tested_at: "2026-09-26T23:05:00+07:00"
evaluator: "Real Headless Browser (Google Chrome 153.0 + Microsoft Edge) on Windows"
description: >
  Auditable evidence manifest for every redesigned P0 journey across
  mobile (360px), tablet (768px), desktop (1280px), keyboard-only
  navigation and 200% browser zoom reflow, backed by 40 real browser screenshot artifacts.

required_viewports:
  - id: "VP-MOBILE"
    width_css_px: 360
    height_css_px: 800
    label: "Mobile (360×800)"
  - id: "VP-TABLET"
    width_css_px: 768
    height_css_px: 1024
    label: "Tablet (768×1024)"
  - id: "VP-DESKTOP"
    width_css_px: 1280
    height_css_px: 900
    label: "Desktop (1280×900)"

required_checks:
  - id: "CHK-KEYBOARD"
    label: "Keyboard-only navigation"
    wcag_criteria: ["2.1.1", "2.4.3", "2.4.7", "2.4.11"]
    ux_refs: ["UX-A11Y-003", "UX-A11Y-004"]
  - id: "CHK-ZOOM-200"
    label: "200% browser zoom reflow"
    wcag_criteria: ["1.4.10", "1.4.12"]
    ux_refs: ["UX-A11Y-007"]
  - id: "CHK-NONCOLOR"
    label: "Non-color status indicators"
    wcag_criteria: ["1.4.1", "1.4.3", "1.4.11"]
    ux_refs: ["UX-A11Y-006"]
  - id: "CHK-SEMANTICS"
    label: "Landmarks, headings, accessible names"
    wcag_criteria: ["1.3.1", "4.1.2"]
    ux_refs: ["UX-A11Y-001", "UX-A11Y-002"]
  - id: "CHK-STATUS"
    label: "Status messages via live regions"
    wcag_criteria: ["4.1.3"]
    ux_refs: ["UX-A11Y-013"]

