      x-requirement-ids: [REQ-F-OPS-001, REQ-F-OPS-002, REQ-F-OPS-003, REQ-F-OPS-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001]
      summary: Read aggregated non-PII operations metrics
      parameters:
        - $ref: "#/components/parameters/FromDateTime"
        - $ref: "#/components/parameters/ToDateTime"
      responses:
        "200":
          description: Aggregated metrics only; no raw prompts or user-level export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsMetrics"
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/privacy/notice:
    get:
      operationId: getActivePrivacyNotice
      tags: [Privacy]
      security: []
      x-contract-id: API-PRIV-001
      x-requirement-ids: [REQ-F-PRIV-001]
      x-control-ids: [SEC-CTRL-006, SEC-CTRL-015]
      x-test-ids: [TASK-TEST-CONTRACT-001, TASK-TEST-SEC-001]
      summary: Read the currently active versioned privacy notice
      description: >-
        This public, cache-controlled resource identifies the synthetic-demo
        status, data categories, purposes, configured retention and the current
        contact-placeholder status. Optional data collection MUST remain disabled
        if no active notice can be retrieved.
      responses:
        "200":
          description: Active notice with immutable version and effective date.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/privacy/consents:
    get:
      operationId: listMyConsentDecisions
      tags: [Privacy]
      x-contract-id: API-PRIV-002
      x-requirement-ids: [REQ-F-PRIV-002]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001]
      summary: List the current actor's consent decisions
      responses:
        "200":
          description: Consent decisions without other users' data.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentDecisionPage"
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: recordConsentDecision
      tags: [Privacy]
      x-contract-id: API-PRIV-003
      x-requirement-ids: [REQ-F-PRIV-001, REQ-F-PRIV-002]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006, SEC-CTRL-015, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001, TASK-TEST-SEC-001]
      summary: Record an affirmative or withdrawn consent decision
      description: >-
        The server verifies that notice_version is the active notice for the
        purpose and rejects unknown purposes, stale notices and absent notice
        configuration. Withdrawal applies prospectively; this operation does not
        retroactively delete data or make legal-completion claims.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsentDecisionRequest"
      responses:
        "201":
          description: Immutable consent-decision receipt.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentDecision"
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/privacy/requests:
    post:
      operationId: createPrivacyRequest
      tags: [Privacy]
      x-contract-id: API-PRIV-004
      x-requirement-ids: [REQ-F-PRIV-001, REQ-F-PRIV-003]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006, SEC-CTRL-015, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001, TASK-TEST-SEC-001]
      summary: Create an authorized privacy-request receipt
      description: >-
        This creates a request and immutable receipt only. It never auto-deletes
        data, exports data or claims legal completion. Any fulfilment remains a
        separately authorized, auditable lifecycle.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../json-schema/privacy/privacy-request.schema.json#/$defs/createRequest"
      responses:
        "201":
          description: Typed privacy request and receipt created exactly once.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "../../json-schema/privacy/privacy-request.schema.json#/$defs/receipt"
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/privacy/requests/{privacy_request_id}:
    get:
      operationId: getMyPrivacyRequestStatus
      tags: [Privacy]
      x-contract-id: API-PRIV-005
      x-requirement-ids: [REQ-F-PRIV-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001]
      summary: Read only the current actor's safe privacy-request status
      description: >-
        A request owned by another actor is answered with a non-disclosing 404.
        The representation excludes internal notes, reviewer identity, raw
        evidence and other users' request data.
      parameters:
        - $ref: "#/components/parameters/PrivacyRequestId"
      responses:
        "200":
          description: Owner-visible status with no internal case notes.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "../../json-schema/privacy/privacy-request.schema.json#/$defs/statusView"
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Capabilities]
      summary: Discover agent tools and capability manifests
      responses:
        "200":
          description: Capability list returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: "#/components/responses/Problem"}
  /v1/operations/capabilities:
    get:
      operationId: getOperationCapabilities
      tags: [Capabilities]
      summary: Discover operation capabilities
      responses:
        "200":
          description: Operation capability list returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Synthetic signed JWT in demo. Future Entra OIDC maps to the same internal
        identity context; clients MUST NOT send actor/role overrides.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 16, maxLength: 2048}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    FromDateTime:
      name: from
      in: query
      required: true
      schema: {type: string, format: date-time}
    ToDateTime:
      name: to
      in: query
      required: true
      schema: {type: string, format: date-time}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[!-~]+$'
    ConversationId: {$ref: "#/components/parameters/UuidConversationId"}
    UuidConversationId:
      name: conversation_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    MessageId:
      name: message_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    DocumentRequestId:
      name: document_request_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    RoomId:
      name: room_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    BookingId:
      name: booking_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    HandoverId:
      name: handover_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    SourceId:
      name: source_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    DocumentVersionId:
      name: document_version_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
    PrivacyRequestId:
      name: privacy_request_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/UuidV7"}
  responses:
    Problem:
      description: RFC 9457 problem details. Exact status and code depend on operation.
      headers:
        X-Request-Id:
          required: true
          schema: {$ref: "#/components/schemas/UuidV7"}
        Retry-After:
          required: false
          schema: {type: string, maxLength: 100}
      content:
        application/problem+json:
          schema:
            $ref: "../../json-schema/common/error.schema.json"
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: alive}
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, dependencies, security_configuration]
      properties:
        status: {type: string, enum: [ready, degraded]}
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$'}
              status: {type: string, enum: [ready, unavailable, disabled]}
        security_configuration:
          type: object
          additionalProperties: false
          required: [demo_auth_guard]
          description: >-
            Coarse startup evidence only. It never enables, names, or routes a
            demo role switch and must not expose identity-provider secrets.
          properties:
            demo_auth_guard:
              type: string
              enum: [ENFORCED, NOT_APPLICABLE]
    Role:
      type: string
      enum: [STUDENT, SUPPORT_OFFICER, KNOWLEDGE_ADMIN, SYSTEM_ADMIN]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, roles, is_synthetic]
      properties:
        user_id: {$ref: "#/components/schemas/UuidV7"}
        display_name: {type: string, minLength: 1, maxLength: 160}
        primary_email: {type: string, format: email}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/Role"}
        faculty_code: {type: string, const: FIT}
        student_code: {type: string, pattern: '^SYN[0-9]{8}$'}
        is_synthetic: {type: boolean, const: true}
    CreateAnswerFeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: string
          enum: [HELPFUL, NOT_HELPFUL]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          description: Optional actor feedback; answer/model/source metadata is server-derived.
    AnswerFeedbackReference:
      type: object
      additionalProperties: false
      required: [answer_id, source_document_version_ids, model_version, prompt_version]
      properties:
        answer_id: {$ref: "#/components/schemas/UuidV7"}
        source_document_version_ids:
          type: array
          uniqueItems: true
          maxItems: 20
          items: {$ref: "#/components/schemas/UuidV7"}
        model_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Immutable provider/model release identifier; never a raw prompt.
        prompt_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Immutable prompt-template version identifier; prompt contents are never returned.
    AnswerFeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, conversation_id, rating, answer_reference, recorded_at]
      properties:
        id: {$ref: "#/components/schemas/UuidV7"}
        conversation_id: {$ref: "#/components/schemas/UuidV7"}
        rating: {type: string, enum: [HELPFUL, NOT_HELPFUL]}
        comment_recorded: {type: boolean}
        answer_reference: {$ref: "#/components/schemas/AnswerFeedbackReference"}
        recorded_at: {type: string, format: date-time}
    PrivacyNotice:
      type: object
      additionalProperties: false
      required: [notice_id, version, effective_at, status, disclaimer, data_categories, purposes, retention_summary]
      properties:
        notice_id: {$ref: "#/components/schemas/UuidV7"}
        version: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'}
        effective_at: {type: string, format: date-time}
        status: {type: string, const: ACTIVE}
        disclaimer:
          $ref: "../../json-schema/config/disclaimer.schema.json#/$defs/syntheticServiceDisclaimer"
        data_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [ACCOUNT_CONTEXT, CONVERSATION_CONTENT, REQUEST_METADATA, AUDIT_METADATA]}
        purposes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [SERVICE_DELIVERY, SAFETY_HANDOVER, QUALITY_FEEDBACK, SECURITY_AUDIT]}
        retention_summary:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [data_class, configured_rule]
            properties:
              data_class: {type: string, minLength: 1, maxLength: 80}
              configured_rule: {type: string, pattern: '^PRIV-RET-[0-9]{3}$'}
    RecordConsentDecisionRequest:
      type: object
      additionalProperties: false
      required: [purpose, decision, notice_version]
      properties:
        purpose: {type: string, enum: [QUALITY_FEEDBACK, OPTIONAL_PERSONALIZATION]}
        decision: {type: string, enum: [GRANTED, WITHDRAWN]}
        notice_version: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'}
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [id, purpose, decision, notice_version, recorded_at]
      properties:
        id: {$ref: "#/components/schemas/UuidV7"}
        purpose: {type: string, enum: [QUALITY_FEEDBACK, OPTIONAL_PERSONALIZATION]}
        decision: {type: string, enum: [GRANTED, WITHDRAWN]}
        notice_version: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'}
        recorded_at: {type: string, format: date-time}
    ConsentDecisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ConsentDecision"}
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more, limit]
      properties:
        next_cursor: {type: [string, "null"], maxLength: 2048}
        has_more: {type: boolean}
        limit: {type: integer, minimum: 1, maximum: 100}
    ScheduleEntry:
      type: object
      additionalProperties: false
      required: [id, course_code, course_name, starts_at, ends_at, source_system]
      properties:
        id: {$ref: "#/components/schemas/UuidV7"}
        course_code: {type: string, minLength: 1, maxLength: 32}
        course_name: {type: string, minLength: 1, maxLength: 200}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        location_label: {type: [string, "null"], maxLength: 160}
        instructor_display_name: {type: [string, "null"], maxLength: 160}
        source_system: {type: string, const: SYNTHETIC_SIS}
    SchedulePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ScheduleEntry"}}
        page: {$ref: "#/components/schemas/PageMeta"}
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
    Conversation:
      type: object
      additionalProperties: false
      required: [id, status, channel, created_at, retention_expires_at, version]
      properties:
        id: {$ref: "#/components/schemas/UuidV7"}
        status: {type: string, enum: [ACTIVE, HANDED_OVER, CLOSED, ARCHIVED]}
        channel: {type: string, const: WEB}
        title: {type: [string, "null"], maxLength: 160}
        last_message_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        retention_expires_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Conversation"}}
        page: {$ref: "#/components/schemas/PageMeta"}
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 10000}
    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, sequence_no, sender_type, content, content_format, citations, created_at]
      properties:
        id: {$ref: "#/components/schemas/UuidV7"}
        conversation_id: {$ref: "#/components/schemas/UuidV7"}
        sequence_no: {type: integer, minimum: 1}
        sender_type: {type: string, enum: [USER, ASSISTANT, STAFF, SYSTEM]}
        content: {type: string, maxLength: 20000}
        content_format: {type: string, enum: [PLAIN_TEXT, MARKDOWN_SAFE]}
        citations:
          type: array
          maxItems: 20
          items: {$ref: "../../json-schema/citations/citation.schema.json"}
        created_at: {type: string, format: date-time}
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Message"}}
        page: {$ref: "#/components/schemas/PageMeta"}
    ActionPreviewRequest:
      oneOf:
        - {$ref: "#/components/schemas/CreateTicketActionRequest"}
        - {$ref: "#/components/schemas/SubmitDocumentActionRequest"}
        - {$ref: "#/components/schemas/CreateRoomBookingActionRequest"}
        - {$ref: "#/components/schemas/CancelActionRequest"}
        - {$ref: "#/components/schemas/CreateHandoverActionRequest"}
        - {$ref: "#/components/schemas/TransitionActionRequest"}
        - {$ref: "#/components/schemas/CreateKnowledgeSourceActionRequest"}
        - {$ref: "#/components/schemas/RegisterDocumentVersionActionRequest"}
        - {$ref: "#/components/schemas/PublishKnowledgeActionRequest"}
    CreateTicketActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
      properties:
        action_type: {type: string, const: CREATE_TICKET}
        payload: {$ref: "../../json-schema/actions/action-preview.schema.json#/$defs/createTicketPayload"}
    SubmitDocumentActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
      properties:
        action_type: {type: string, const: SUBMIT_DOCUMENT_REQUEST}
        payload: {$ref: "../../json-schema/actions/action-preview.schema.json#/$defs/documentRequestPayload"}
    CreateRoomBookingActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
      properties:
        action_type: {type: string, const: CREATE_ROOM_BOOKING}
        payload: {$ref: "../../json-schema/actions/action-preview.schema.json#/$defs/roomBookingPayload"}
    CancelActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
      properties:
        action_type: {type: string, enum: [CANCEL_ROOM_BOOKING, CANCEL_DOCUMENT_REQUEST]}
        payload: {$ref: "../../json-schema/actions/action-preview.schema.json#/$defs/cancelPayload"}
    CreateHandoverActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
      properties:
        action_type: {type: string, const: CREATE_HANDOVER}
        payload: {$ref: "../../json-schema/actions/action-preview.schema.json#/$defs/createHandoverPayload"}
    TransitionActionRequest:
      type: object
      additionalProperties: false
      required: [action_type, payload]
