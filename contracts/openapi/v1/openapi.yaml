openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-document-control:
  document_id: API-OAS-V1-001
  version: 1.1.0
  status: reviewed
  owner: API Architect
  approvers:
    - Solution Architect
    - Security Lead
    - Product Owner
  last_updated: 2026-09-22
info:
  title: Campus 24/7 API
  version: 1.1.0
  description: >-
    Contract-first HTTP API skeleton for the single-institution HUCE Demo V1.
    All data is synthetic until real-data approvals exist. Write actions are
    created only through preview and explicit confirmation.
  contact:
    name: Campus 24/7 Architecture
servers:
  - url: http://localhost:8000
    description: Local development with synthetic data only
  - url: https://api.staging.campus247.example
    description: Staging placeholder; synthetic data only
tags:
  - name: System
  - name: Identity
  - name: Schedule
  - name: Conversations
  - name: Actions
  - name: Tickets
  - name: DocumentRequests
  - name: Rooms
  - name: RoomBookings
  - name: Handovers
  - name: Knowledge
  - name: Operations
  - name: Feedback
  - name: Privacy
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [System]
      security: []
      x-contract-id: API-SYS-001
      x-requirement-ids: [REQ-NF-REL-001]
      x-control-ids: [SEC-CTRL-018]
      x-test-ids: [TASK-TEST-CONTRACT-001]
      summary: Process liveness
      responses:
        "200":
          description: Process is alive; does not assert dependency readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        default:
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [System]
      security: []
      x-contract-id: API-SYS-002
      x-requirement-ids: [REQ-NF-REL-004, REQ-F-AUTH-004]
      x-control-ids: [SEC-CTRL-002, SEC-CTRL-020]
      x-test-ids: [TASK-TEST-OPENAPI-001, TASK-TEST-SEC-001]
      summary: Dependency readiness
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Identity]
      x-contract-id: API-IDENTITY-001
      x-requirement-ids: [REQ-F-AUTH-001, REQ-F-AUTH-002]
      x-control-ids: [SEC-CTRL-002, SEC-CTRL-003]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001]
      summary: Resolve the current user only from verified authentication context
      responses:
        "200":
          description: Current synthetic user and effective role bindings.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      tags: [Identity]
      x-contract-id: API-AUTH-001
      x-requirement-ids: [REQ-F-AUTH-003]
      x-control-ids: [SEC-CTRL-002, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-SEC-001, TASK-TEST-CONTRACT-001]
      summary: Invalidate the current authenticated session
      description: >-
        The server revokes the current session or token identifier before returning
        success. This endpoint has no role-selection input and never creates a demo
        identity. A revocation failure is an error; clients MUST NOT treat it as logout.
      responses:
        "204":
          description: Current session is invalidated. The response has no body.
        "401": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/students/me/schedule:
    get:
      operationId: listMySchedule
      tags: [Schedule]
      x-contract-id: API-SCHEDULE-001
      x-requirement-ids: [REQ-F-SCHEDULE-001, REQ-F-SCHEDULE-002, REQ-F-SCHEDULE-003, REQ-F-SCHEDULE-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-001]
      summary: List the authenticated student's synthetic schedule
      parameters:
        - $ref: "#/components/parameters/FromDateTime"
        - $ref: "#/components/parameters/ToDateTime"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Schedule page ordered by starts_at ASC, id ASC.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/conversations:
    get:
      operationId: listMyConversations
      tags: [Conversations]
      x-contract-id: API-CONV-001
      x-requirement-ids: [REQ-F-CHAT-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-001]
      summary: List conversations owned by the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createConversation
      tags: [Conversations]
      x-contract-id: API-CONV-002
      x-requirement-ids: [REQ-F-CHAT-001]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-CONTRACT-001, TASK-TEST-E2E-001]
      summary: Create an empty conversation
      description: >-
        This is a reversible container creation and does not execute an external
        business side effect. It still requires idempotency to prevent duplicates.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/conversations/{conversation_id}/messages:
    get:
      operationId: listConversationMessages
      tags: [Conversations]
      x-contract-id: API-CONV-003
      x-requirement-ids: [REQ-F-CHAT-001, REQ-F-CHAT-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-001]
      summary: List messages for an authorized conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages ordered by sequence_no ASC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/conversations/{conversation_id}/messages:stream:
    post:
      operationId: streamConversationMessage
      tags: [Conversations]
      x-contract-id: API-CONV-004
      x-requirement-ids: [REQ-F-CHAT-002, REQ-F-CHAT-003, REQ-F-CHAT-005, REQ-F-CHAT-006]
      x-control-ids: [SEC-CTRL-006, SEC-CTRL-013, SEC-CTRL-014]
      x-test-ids: [TASK-TEST-CONTRACT-001, TASK-TEST-SEC-001]
      summary: Submit a message and stream the assistant response using SSE
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: >-
            SSE stream with message.started, message.delta, citation.added,
            message.completed or message.failed events. Only message.completed is final.
          content:
            text/event-stream:
              schema:
                type: string
                description: UTF-8 Server-Sent Events stream.
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/conversations/{conversation_id}/messages/{message_id}/feedback:
    post:
      operationId: createAnswerFeedback
      tags: [Feedback]
      x-contract-id: API-FEEDBACK-001
      x-requirement-ids: [REQ-F-CHAT-007]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006, SEC-CTRL-015, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-CONTRACT-001]
      summary: Record structured feedback for an owned assistant answer
      description: >-
        The server authorizes conversation and answer ownership, then binds the
        rating to immutable server-side answer, source-version, model-version and
        prompt-version references. Clients cannot submit or replace those references.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnswerFeedbackRequest"
      responses:
        "201":
          description: Feedback recorded against immutable answer metadata.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerFeedbackReceipt"
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/actions/preview:
    post:
      operationId: createActionPreview
      tags: [Actions]
      x-contract-id: API-ACTION-001
      x-requirement-ids: [REQ-F-TICKET-003, REQ-F-DOC-003, REQ-F-ROOM-004, REQ-F-HITL-002, REQ-F-KNOW-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006, SEC-CTRL-008]
      x-test-ids: [TASK-TEST-ACTION-001, TASK-TEST-CONTRACT-001]
      summary: Validate and preview one write action without executing it
      description: >-
        The actor is always resolved from authentication context. The server
        normalizes payload, evaluates policy and returns a one-time confirmation token.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionPreviewRequest"
      responses:
        "201":
          description: Immutable action preview awaiting confirmation.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "../../json-schema/actions/action-preview.schema.json"
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/actions/{preview_id}/confirm:
    post:
      operationId: confirmAction
      tags: [Actions]
      x-contract-id: API-ACTION-002
      x-requirement-ids: [REQ-F-TICKET-004, REQ-F-ROOM-005, REQ-F-HITL-003, REQ-F-KNOW-005]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-008, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-ACTION-001, TASK-TEST-SEC-001]
      summary: Confirm and execute exactly the immutable preview
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../json-schema/actions/action-confirmation.schema.json"
      responses:
        "202":
          description: Execution accepted or idempotently replayed.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionExecution"
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/action-executions/{execution_id}:
    get:
      operationId: getActionExecution
      tags: [Actions]
      x-contract-id: API-ACTION-003
      x-requirement-ids: [REQ-F-TICKET-005, REQ-F-DOC-004, REQ-F-ROOM-005, REQ-F-HITL-004, REQ-F-KNOW-007]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-018]
      x-test-ids: [TASK-TEST-ACTION-001, TASK-TEST-E2E-002]
      summary: Read an authorized action execution result
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Current execution status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionExecution"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/tickets:
    get:
      operationId: listMyTickets
      tags: [Tickets]
      x-contract-id: API-TICKET-001
      x-requirement-ids: [REQ-F-TICKET-006, REQ-F-TICKET-007]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: List tickets visible to the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "../../json-schema/tickets/ticket-state.schema.json"
          style: form
          explode: true
      responses:
        "200":
          description: Ticket page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        default: {$ref: "#/components/responses/Problem"}
  /v1/tickets/{ticket_id}:
    get:
      operationId: getTicket
      tags: [Tickets]
      x-contract-id: API-TICKET-002
      x-requirement-ids: [REQ-F-TICKET-006, REQ-F-TICKET-007]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: Get an authorized ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket resource.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/document-requests:
    get:
      operationId: listMyDocumentRequests
      tags: [DocumentRequests]
      x-contract-id: API-DOC-001
      x-requirement-ids: [REQ-F-DOC-001, REQ-F-DOC-002]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: List the current student's synthetic document requests
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Document request page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequestPage"
        default: {$ref: "#/components/responses/Problem"}
  /v1/document-requests/{document_request_id}:
    get:
      operationId: getDocumentRequest
      tags: [DocumentRequests]
      x-contract-id: API-DOC-002
      x-requirement-ids: [REQ-F-DOC-004]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: Get an authorized synthetic document request
      parameters:
        - $ref: "#/components/parameters/DocumentRequestId"
      responses:
        "200":
          description: Document request. It MUST be visibly marked synthetic.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequest"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/rooms:
    get:
      operationId: listRooms
      tags: [Rooms]
      x-contract-id: API-ROOM-001
      x-requirement-ids: [REQ-F-ROOM-001]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-CONTRACT-001, TASK-TEST-E2E-002]
      summary: List synthetic rooms
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: minimum_capacity
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: Room page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPage"
        default: {$ref: "#/components/responses/Problem"}
  /v1/rooms/{room_id}/availability:
    get:
      operationId: getRoomAvailability
      tags: [Rooms]
      x-contract-id: API-ROOM-002
      x-requirement-ids: [REQ-F-ROOM-001, REQ-F-ROOM-003]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-CONTRACT-001, TASK-TEST-E2E-002]
      summary: Get advisory room availability for a bounded range
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/FromDateTime"
        - $ref: "#/components/parameters/ToDateTime"
      responses:
        "200":
          description: Advisory availability; confirmation rechecks conflicts atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomAvailability"
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/room-bookings:
    get:
      operationId: listMyRoomBookings
      tags: [RoomBookings]
      x-contract-id: API-BOOKING-001
      x-requirement-ids: [REQ-F-ROOM-002, REQ-F-ROOM-005, REQ-F-ROOM-008]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: List room bookings visible to the current user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Room booking page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBookingPage"
        default: {$ref: "#/components/responses/Problem"}
  /v1/room-bookings/{booking_id}:
    get:
      operationId: getRoomBooking
      tags: [RoomBookings]
      x-contract-id: API-BOOKING-002
      x-requirement-ids: [REQ-F-ROOM-005, REQ-F-ROOM-008]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-006]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-002]
      summary: Get an authorized room booking
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Room booking.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomBooking"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/handovers/{handover_id}:
    get:
      operationId: getHandover
      tags: [Handovers]
      x-contract-id: API-HANDOVER-001
      x-requirement-ids: [REQ-F-HITL-001, REQ-F-HITL-004, REQ-F-HITL-006]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015, SEC-CTRL-025]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-003]
      summary: Get a handover visible to requester or authorized staff
      parameters:
        - $ref: "#/components/parameters/HandoverId"
      responses:
        "200":
          description: Minimized handover resource.
          headers:
            ETag:
              required: true
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: "../../json-schema/handover/handover.schema.json"
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/staff/handovers:
    get:
      operationId: listStaffHandovers
      tags: [Handovers]
      x-contract-id: API-HANDOVER-002
      x-requirement-ids: [REQ-F-HITL-001, REQ-F-HITL-004, REQ-F-HITL-006]
      x-control-ids: [SEC-CTRL-003, SEC-CTRL-015, SEC-CTRL-025]
      x-test-ids: [TASK-TEST-AUTHZ-001, TASK-TEST-E2E-003]
      summary: List handovers in queues allowed by staff role bindings
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: queue_key
          in: query
          required: false
          schema: {type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$'}
        - name: risk_level
          in: query
          required: false
          schema:
            type: array
            maxItems: 4
            items: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
          style: form
          explode: true
      responses:
        "200":
          description: Queue-scoped handover page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverPage"
        "403": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /v1/knowledge/sources:
    get:
      operationId: listKnowledgeSources
      tags: [Knowledge]
      x-contract-id: API-KNOW-001
      x-requirement-ids: [REQ-F-KNOW-001, REQ-F-KNOW-003, REQ-F-KNOW-006]
