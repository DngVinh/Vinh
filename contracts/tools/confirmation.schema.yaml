document_id: "DOC-TOOL-SCHEMA-005"
version: "1.0.0"
status: "reviewed"
owner: "Security Architect"
approvers: ["Backend Architecture Lead", "Product Owner"]
last_updated: "2026-09-21"
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://campus247.example/schemas/tools/confirmation.schema.yaml"
title: "Action confirmation contracts"
$defs:
  resume_input:
    type: "object"
    additionalProperties: false
    required: ["preview_id", "decision", "confirmation_token"]
    properties:
      preview_id:
        $ref: "common.schema.yaml#/$defs/uuid"
      decision:
        type: "string"
        enum: ["approve", "reject"]
      confirmation_token:
        type: "string"
        minLength: 20
        maxLength: 4096
  verified_claims:
    type: "object"
    additionalProperties: false
    required: ["preview_id", "actor_ref", "conversation_id", "tool_id", "contract_version", "payload_hash", "policy_version", "issued_at", "expires_at", "nonce", "consumed"]
    properties:
      preview_id:
        $ref: "common.schema.yaml#/$defs/uuid"
      actor_ref:
        $ref: "common.schema.yaml#/$defs/reference_id"
      conversation_id:
        $ref: "common.schema.yaml#/$defs/uuid"
      tool_id:
        type: "string"
        pattern: "^TOOL-[A-Z]+-[0-9]{3}$"
      contract_version:
        type: "string"
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      payload_hash:
        $ref: "common.schema.yaml#/$defs/sha256"
      policy_version:
        type: "string"
        minLength: 1
        maxLength: 50
      issued_at:
        type: "string"
        format: "date-time"
      expires_at:
        type: "string"
        format: "date-time"
      nonce:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{16,128}$"
      consumed:
        type: "boolean"
