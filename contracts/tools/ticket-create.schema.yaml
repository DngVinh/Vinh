document_id: "DOC-TOOL-TICKET-001"
version: "1.0.0"
status: "reviewed"
owner: "Backend Architecture Lead"
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://campus247.example/schemas/tools/ticket-create.schema.yaml"
title: "ticket_create contract"
description: "Requester, roles, queue and authorization are trusted broker context and are not accepted from the model."
$defs:
  input:
    type: "object"
    additionalProperties: false
    required: ["category", "subject", "description", "contact_preference", "attachment_refs"]
    properties:
      category:
        type: "string"
        enum: ["GENERAL_SUPPORT", "ACADEMIC_POLICY", "DOCUMENT_REQUEST_SUPPORT", "FACILITY", "COMPLAINT", "OTHER"]
      subject: {type: "string", minLength: 1, maxLength: 200}
      description: {type: "string", minLength: 1, maxLength: 5000}
      contact_preference:
        type: "string"
        enum: ["IN_APP", "EMAIL_FAKE", "NONE"]
      attachment_refs:
        type: "array"
        maxItems: 10
        uniqueItems: true
        items: {$ref: "common.schema.yaml#/$defs/reference_id"}
  result:
    type: "object"
    additionalProperties: false
    required: ["ticket_id", "category", "priority", "status", "subject", "queue_key", "created_at", "version"]
    properties:
      ticket_id: {$ref: "common.schema.yaml#/$defs/uuid"}
      category:
        type: "string"
        enum: ["GENERAL_SUPPORT", "ACADEMIC_POLICY", "DOCUMENT_REQUEST_SUPPORT", "FACILITY", "COMPLAINT", "OTHER"]
      priority: {type: "string", enum: ["LOW", "NORMAL", "HIGH", "CRITICAL"]}
      status: {const: "OPEN"}
      subject: {type: "string", minLength: 1, maxLength: 200}
      queue_key: {type: "string", pattern: "^[A-Z][A-Z0-9_]{1,63}$"}
      created_at: {type: "string", format: "date-time"}
      version: {type: "integer", minimum: 1}
  output:
    type: "object"
    additionalProperties: false
    required: ["status", "result", "error"]
    properties:
      status: {type: "string", enum: ["succeeded", "failed", "uncertain"]}
      result:
        oneOf:
          - $ref: "#/$defs/result"
          - type: "null"
      error:
        oneOf:
          - $ref: "common.schema.yaml#/$defs/tool_error"
          - type: "null"
    allOf:
      - if: {properties: {status: {const: "succeeded"}}}
        then:
          properties:
            result: {$ref: "#/$defs/result"}
            error: {type: "null"}
      - if: {properties: {status: {enum: ["failed", "uncertain"]}}}
        then:
          properties:
            result: {type: "null"}
            error: {$ref: "common.schema.yaml#/$defs/tool_error"}
