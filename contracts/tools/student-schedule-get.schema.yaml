document_id: "DOC-TOOL-SCHEDULE-001"
version: "1.0.0"
status: "reviewed"
owner: "Backend Architecture Lead"
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://campus247.example/schemas/tools/student-schedule-get.schema.yaml"
title: "student_schedule_get contract"
description: "The authenticated subject is injected from trusted context; model input cannot select a student."
$defs:
  input:
    type: "object"
    additionalProperties: false
    required: ["from", "to"]
    properties:
      from:
        type: "string"
        format: "date-time"
      to:
        type: "string"
        format: "date-time"
      cursor:
        type: ["string", "null"]
        maxLength: 512
      limit:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
  schedule_entry:
    type: "object"
    additionalProperties: false
    required: ["id", "course_code", "course_name", "starts_at", "ends_at", "source_system"]
    properties:
      id: {$ref: "common.schema.yaml#/$defs/uuid"}
      course_code: {type: "string", minLength: 1, maxLength: 32}
      course_name: {type: "string", minLength: 1, maxLength: 200}
      starts_at: {type: "string", format: "date-time"}
      ends_at: {type: "string", format: "date-time"}
      location_label: {type: ["string", "null"], maxLength: 160}
      instructor_display_name: {type: ["string", "null"], maxLength: 160}
      source_system: {const: "SYNTHETIC_SIS"}
  result:
    type: "object"
    additionalProperties: false
    required: ["items", "page"]
    properties:
      items:
        type: "array"
        maxItems: 100
        items: {$ref: "#/$defs/schedule_entry"}
      page: {$ref: "common.schema.yaml#/$defs/page_info"}
  output:
    type: "object"
    additionalProperties: false
    required: ["status", "result", "error"]
    properties:
      status: {type: "string", enum: ["succeeded", "failed", "uncertain"]}
      result:
        oneOf:
          - $ref: "#/$defs/result"
          - type: "null"
      error:
        oneOf:
          - $ref: "common.schema.yaml#/$defs/tool_error"
          - type: "null"
    allOf:
      - if: {properties: {status: {const: "succeeded"}}}
        then:
          properties:
            result: {$ref: "#/$defs/result"}
            error: {type: "null"}
      - if: {properties: {status: {enum: ["failed", "uncertain"]}}}
        then:
          properties:
            result: {type: "null"}
            error: {$ref: "common.schema.yaml#/$defs/tool_error"}
