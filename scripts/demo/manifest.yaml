    name: "study_room_reservation"
    description: "Student reserves group study room in building H1"
    target_roles: ["student"]
  - id: "SCENARIO-03"
    name: "transcript_request"
    description: "Student requests official grade transcript with preview and confirmation"
    target_roles: ["student"]
  - id: "SCENARIO-04"
    name: "crisis_handover_escalation"
    description: "Urgent student distress request safely handed over to staff queue"
    target_roles: ["student", "staff"]
