name: Security & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Supply Chain and Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml jsonschema

      - name: Validate Lockfiles Integrity (SBOM)
        run: |
          sha256sum uv.lock
          sha256sum pnpm-lock.yaml

      - name: Run Secret and Egress Security Tests
        run: python -m pytest -q tests/security/test_no_sensitive_egress.py tests/security/test_ssrf_and_links.py tests/security/test_knowledge_poisoning.py tests/security/test_web_boundaries.py
