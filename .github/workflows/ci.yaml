name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-checks:
    name: Lint, Typecheck and Unit Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyyaml jsonschema

      - name: Validate Task Catalog
        run: python tasks/tools/validate_catalog.py

      - name: Validate OpenAPI Specifications
        run: python contracts/tools/validate_openapi.py

      - name: Run Pytest Regression Suite
        run: python -m pytest -q
