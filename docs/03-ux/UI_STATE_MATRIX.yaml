    required_actions: ["retry_connection", "keep_privacy_safe_local_draft", "read_labeled_cache_if_allowed"]
    telemetry: ["ui.state.presented", "ui.state.recovered"]
    wcag_checks: ["A11Y-STATUS", "A11Y-NONCOLOR", "A11Y-KEYBOARD"]
    trace_ids: ["UX-INT-050", "UX-SCR-903", "SEC-DATA-004"]
    prohibitions: ["enable_write", "auto_submit_on_reconnect", "cache_restricted_staff_content"]

