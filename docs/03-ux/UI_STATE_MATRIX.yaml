document:
  document_id: "DOC-UX-010"
  title: "Campus 24/7 machine-readable UI state matrix"
  version: "0.1.0"
  status: "reviewed"
  owner: "Product Design Lead"
  approvers:
    - "Product Owner"
    - "Accessibility Lead"
    - "Security/Privacy Lead"
  last_updated: "2026-09-22"
  normative_language: "MUST"
  language: "vi-VN"

scope:
  product: "Campus 24/7 — HUCE Demo"
  institution_count: 1
  data_mode: "synthetic_only"
  channels:
    - "responsive_web"
    - "pwa"
  conformance_target: "WCAG 2.2 AA"
  source_documents:
    - "docs/03-ux/README.md"
    - "docs/03-ux/SCREEN_INVENTORY.md"
    - "docs/03-ux/INTERACTION_SPECIFICATIONS.md"
    - "docs/03-ux/TRUST_AND_CITATION_UX.md"
    - "docs/03-ux/ACTION_PREVIEW_AND_CONFIRMATION_UX.md"
    - "docs/03-ux/SYSTEM_STATES_AND_RECOVERY.md"
    - "docs/03-ux/ACCESSIBILITY.md"
    - "docs/03-ux/CONTENT_STYLE_VI.md"

semantics:
  unauthorized:
    http_status: 401
    state_id: "UX-STATE-012"
    meaning: "Chưa có hoặc đã hết phiên xác thực; chưa đưa ra quyết định quyền."
  forbidden:
    http_status: 403
    state_id: "UX-STATE-010"
    meaning: "Đã xác thực nhưng không được phép truy cập tài nguyên hoặc hành động."
  unknown_is_not:
    - "empty"
    - "zero"
    - "success"
    - "authorized"
  write_success_rule: "Chỉ render thành công sau kết quả authoritative; optimistic success bị cấm."
  protected_render_rule: "Authorize trước fetch và trước render; overlay không được dùng để che dữ liệu đã tải."
  offline_write_rule: "Không gửi hoặc tự gửi lại write khi offline/reconnect; draft cục bộ chỉ được giữ nếu privacy-safe."

state_precedence:
  - "security_block_or_suspended"
  - "emergency_safety_surface"
  - "forbidden_or_authentication_required"
  - "action_result_unknown"
  - "offline"
  - "degraded_partial_or_stale"
  - "recoverable_error_or_rate_limit"
  - "loading_or_processing"
  - "empty_or_zero_results"
  - "ready_or_success"

roles:
  public:
    persona_refs: []
    service_role_refs: []
    description: "Người chưa xác thực; chỉ được xem surface công khai."
  student:
    persona_refs: ["PER-001"]
    service_role_refs: []
    description: "Sinh viên chỉ thao tác trên dữ liệu và yêu cầu của chính mình."
  support_officer:
    persona_refs: ["PER-002"]
    service_role_refs: ["SVC-ROLE-001"]
    description: "Cán bộ hỗ trợ trong queue/unit được phân quyền."
  queue_lead:
    persona_refs: ["PER-002"]
    service_role_refs: ["SVC-ROLE-002"]
    description: "Điều phối queue và escalation trong phạm vi được giao."
  student_support_lead:
    persona_refs: ["PER-002"]
    service_role_refs: ["SVC-ROLE-003"]
    description: "Chịu trách nhiệm nghiệp vụ hỗ trợ sinh viên."
  knowledge_administrator:
    persona_refs: ["PER-003"]
    service_role_refs: ["SVC-ROLE-004"]
    description: "Quản trị nguồn, phiên bản, review và publish tri thức."
  operations_administrator:
    persona_refs: ["PER-004"]
    service_role_refs: ["SVC-ROLE-005"]
    description: "Vận hành dịch vụ; không mặc nhiên được đọc dữ liệu nhạy cảm."
  security_privacy_lead:
    persona_refs: ["PER-004"]
    service_role_refs: ["SVC-ROLE-006"]
    description: "Review control, incident và privacy evidence theo need-to-know."
  ai_quality_lead:
    persona_refs: ["PER-003", "PER-004"]
    service_role_refs: ["SVC-ROLE-007"]
    description: "Theo dõi chất lượng AI và evidence; không có quyền nghiệp vụ mặc định."
  product_owner:
    persona_refs: ["PER-004"]
    service_role_refs: ["SVC-ROLE-008"]
    description: "Phê duyệt outcome sản phẩm; không có quyền dữ liệu mặc định."

telemetry_contract:
  event_names:
    state_presented: "ui.state.presented"
    state_recovered: "ui.state.recovered"
    action_invoked: "ui.action.invoked"
    confirmation_presented: "ui.confirmation.presented"
    confirmation_resolved: "ui.confirmation.resolved"
    handover_presented: "ui.handover.presented"
  required_fields:
    - "schema_version"
    - "occurred_at"
    - "screen_id"
    - "state_id"
    - "role_key"
    - "environment"
    - "release_id"
    - "correlation_id"
    - "result"
  optional_safe_fields:
    - "latency_bucket"
    - "retry_count"
    - "dependency_code"
    - "action_key"
    - "source_freshness_bucket"
  prohibited_fields:
    - "raw_prompt"
    - "raw_response"
    - "message_text"
    - "student_id"
    - "email"
    - "phone"
    - "access_token"
    - "confirmation_token"
    - "ticket_body"
    - "sensitive_reason"
  privacy_refs: ["PRIV-FLOW-008", "PRIV-FLOW-014", "SEC-DATA-003", "SEC-CTRL-018"]

wcag_check_catalog:
  A11Y-SEMANTICS:
    criteria: ["1.3.1", "4.1.2"]
    ux_refs: ["UX-A11Y-001", "UX-A11Y-002"]
    assertion: "Landmark, heading, accessible name, role và value đúng ngữ nghĩa."
  A11Y-KEYBOARD:
    criteria: ["2.1.1", "2.4.3", "2.4.7", "2.4.11"]
    ux_refs: ["UX-A11Y-003", "UX-A11Y-004"]
    assertion: "Mọi action dùng được bằng bàn phím; focus có thứ tự, nhìn thấy và không bị che."
  A11Y-DIALOG:
    criteria: ["2.1.2", "2.4.3", "4.1.2"]
    ux_refs: ["UX-A11Y-005"]
    assertion: "Dialog có tên, focus ban đầu hợp lý, trap đúng và trả focus về trigger."
  A11Y-NONCOLOR:
    criteria: ["1.4.1", "1.4.3", "1.4.11"]
    ux_refs: ["UX-A11Y-006"]
    assertion: "Không truyền đạt status chỉ bằng màu; text và non-text contrast đạt target."
  A11Y-REFLOW:
    criteria: ["1.4.10", "1.4.12", "2.5.8"]
    ux_refs: ["UX-A11Y-007", "UX-A11Y-008"]
    assertion: "Không mất copy/action ở reflow, zoom, text spacing hoặc viewport nhỏ."
  A11Y-REDUCED-MOTION:
    criteria: ["2.2.2", "2.3.3"]
    ux_refs: ["UX-A11Y-009"]
    assertion: "Không có chuyển động bắt buộc; animation dừng được và tôn trọng reduced motion."
  A11Y-FORM-ERROR:
    criteria: ["3.3.1", "3.3.2", "3.3.3", "3.3.7", "3.3.8"]
    ux_refs: ["UX-A11Y-010", "UX-A11Y-011"]
    assertion: "Label/instruction/error rõ, input hợp lệ được giữ, confirmation không dựa vào trí nhớ."
  A11Y-AUTH:
    criteria: ["3.3.8"]
    ux_refs: ["UX-A11Y-012"]
    assertion: "Authentication không tạo cognitive-function test không có alternative."
  A11Y-STATUS:
    criteria: ["4.1.3"]
    ux_refs: ["UX-A11Y-013"]
    assertion: "Loading, error, success và recovery được announce một lần, không spam live region."
  A11Y-CHAT:
    criteria: ["1.3.1", "2.4.3", "4.1.3"]
    ux_refs: ["UX-A11Y-014"]
    assertion: "Transcript có structure/author; streaming không cướp focus hoặc đọc lại toàn bộ."
  A11Y-DATA:
    criteria: ["1.3.1", "1.4.1"]
    ux_refs: ["UX-A11Y-015"]
    assertion: "Bảng/chart có header, tên, summary và text alternative phù hợp."
  A11Y-LANGUAGE:
    criteria: ["3.1.1", "3.1.2"]
    ux_refs: ["UX-A11Y-016"]
    assertion: "Ngôn ngữ trang và đoạn đổi ngôn ngữ được khai báo."
  A11Y-TIME:
    criteria: ["2.2.1", "2.2.6"]
    ux_refs: ["UX-A11Y-017"]
    assertion: "Timeout/expiry được báo trước khi có thể và không gây mất input."
  A11Y-CRITICAL:
    criteria: ["1.3.1", "1.4.1", "2.4.3", "4.1.3"]
    ux_refs: ["UX-A11Y-018"]
    assertion: "Thông báo safety nổi bật bằng nhiều cue, focus hợp lý và action luôn tiếp cận được."

states:
  - id: "UX-STATE-001"
    key: "initial_loading"
    category: "loading"
    trigger: "Initial read has started and no authoritative content is available."
    required_copy:
      status: "Đang tải thông tin…"
      timeout_transition: "Chưa thể tải thông tin. Bạn có thể thử lại."
    required_actions: []
    telemetry: ["ui.state.presented", "ui.state.recovered"]
    wcag_checks: ["A11Y-SEMANTICS", "A11Y-STATUS", "A11Y-REDUCED-MOTION"]
    trace_ids: ["UX-INT-003", "UX-A11Y-013"]
    prohibitions: ["infinite_spinner", "hide_page_title", "announce_every_skeleton_change"]
  - id: "UX-STATE-002"
    key: "ai_generating_or_validating"
    category: "loading"
    trigger: "AI response is generating or evidence validation is running."
    required_copy:
      generating: "Đang soạn câu trả lời…"
      validating: "Đang kiểm tra nguồn…"
      stopped: "Đã dừng tạo câu trả lời. Nội dung hiện tại chưa hoàn tất."
    required_actions: ["stop_generation"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-CHAT", "A11Y-STATUS", "A11Y-KEYBOARD"]
    trace_ids: ["UX-INT-010", "UX-INT-011", "UX-TRUST-006", "UX-TRUST-007"]
    prohibitions: ["enable_citation_before_validation", "render_raw_tool_calls", "move_focus_per_token"]
  - id: "UX-STATE-003"
    key: "form_submitting_or_validating"
    category: "loading"
    trigger: "A form is validating or a bounded request is in progress."
    required_copy:
      validating: "Đang kiểm tra thông tin…"
      submitting: "Đang gửi…"
    required_actions: ["prevent_duplicate_activation", "preserve_valid_input"]
    telemetry: ["ui.state.presented", "ui.state.recovered"]
    wcag_checks: ["A11Y-FORM-ERROR", "A11Y-STATUS", "A11Y-TIME"]
    trace_ids: ["UX-INT-020", "UX-INT-052"]
    prohibitions: ["clear_input_on_failure", "optimistic_success"]
  - id: "UX-STATE-004"
    key: "true_empty"
    category: "empty"
    trigger: "Authorized read succeeded and the complete collection is empty."
    required_copy:
      title: "Chưa có dữ liệu"
      body: "Không có mục nào trong phạm vi hiện tại."
    required_actions: ["contextual_primary_action_or_none"]
    telemetry: ["ui.state.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-SEMANTICS", "A11Y-KEYBOARD", "A11Y-REFLOW"]
    trace_ids: ["UX-CONTENT-006"]
    prohibitions: ["show_before_fetch", "show_when_permission_unknown", "reuse_error_copy"]
  - id: "UX-STATE-005"
    key: "zero_search_results"
    category: "empty"
    trigger: "Authorized search completed but current query or filters matched zero items."
    required_copy:
      title: "Không có kết quả phù hợp"
      body: "Hãy đổi từ khóa hoặc xóa bớt bộ lọc."
    required_actions: ["clear_filters", "edit_query"]
    telemetry: ["ui.state.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-SEMANTICS", "A11Y-KEYBOARD", "A11Y-STATUS"]
    trace_ids: ["UX-INT-030", "UX-CONTENT-006"]
    prohibitions: ["claim_collection_is_empty", "log_query_text"]
  - id: "UX-STATE-006"
    key: "partial_data"
    category: "degraded"
    trigger: "At least one independent region succeeded and at least one failed or is unknown."
    required_copy:
      banner: "Một phần thông tin chưa tải được."
      region: "Không thể cập nhật phần này."
    required_actions: ["retry_failed_region", "continue_with_labeled_available_data"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-STATUS", "A11Y-NONCOLOR", "A11Y-DATA"]
    trace_ids: ["UX-INT-003", "REQ-NF-REL-004"]
    prohibitions: ["blank_entire_screen", "compute_aggregate_as_complete", "mark_unknown_green"]
  - id: "UX-STATE-007"
    key: "recoverable_error"
    category: "error"
    trigger: "Operation failed with known effect status and safe retry or alternative."
    required_copy:
      title: "Chưa thể hoàn tất"
      impact: "Nêu rõ dữ liệu hoặc yêu cầu đã được ghi hay chưa."
      reference: "Mã tham chiếu: {correlation_id}"
    required_actions: ["bounded_retry", "safe_alternative_or_help"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-FORM-ERROR", "A11Y-STATUS", "A11Y-KEYBOARD"]
    trace_ids: ["UX-CONTENT-010", "UX-INT-003"]
    prohibitions: ["generic_error_only", "stack_trace", "secret_in_reference", "erase_draft"]
  - id: "UX-STATE-008"
    key: "rate_limited_or_busy"
    category: "error"
    trigger: "Server reports bounded capacity or rate-limit response."
    required_copy:
      title: "Hệ thống đang bận"
      retry: "Bạn có thể thử lại{retry_after_clause}."
    required_actions: ["retry_when_safe", "use_alternative_if_available"]
    telemetry: ["ui.state.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-STATUS", "A11Y-TIME", "A11Y-KEYBOARD"]
    trace_ids: ["UX-CONTENT-010", "SEC-CTRL-017"]
    prohibitions: ["invent_retry_time", "blame_user", "blind_resubmit_after_confirmation"]
  - id: "UX-STATE-009"
    key: "degraded_or_safe_mode"
    category: "degraded"
    trigger: "One or more capabilities are intentionally restricted or unavailable."
    required_copy:
      banner: "Một số chức năng đang tạm hạn chế."
      detail: "Nêu capability bị ảnh hưởng và phương án còn dùng được."
    required_actions: ["use_available_alternative", "view_service_status"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-STATUS", "A11Y-NONCOLOR", "A11Y-CRITICAL"]
    trace_ids: ["REQ-F-OPS-002", "SEC-CTRL-020"]
    prohibitions: ["normal_operation_claim", "green_only_indicator", "hide_unavailable_capability"]
  - id: "UX-STATE-010"
    key: "not_authorized"
    category: "forbidden"
    trigger: "Authenticated actor lacks function, object, field, queue or unit permission."
    required_copy:
      title: "Bạn không có quyền truy cập nội dung này"
      body: "Hãy quay lại khu vực được phép hoặc liên hệ đầu mối đã được phê duyệt."
    required_actions: ["navigate_to_safe_destination", "request_access_or_help_if_approved"]
    telemetry: ["ui.state.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-SEMANTICS", "A11Y-KEYBOARD", "A11Y-STATUS"]
    trace_ids: ["SEC-CTRL-003", "SEC-AUTHZ-001", "UX-SCR-901"]
    prohibitions: ["fetch_or_render_protected_data", "reveal_object_existence", "show_bypass_action"]
  - id: "UX-STATE-011"
    key: "maintenance_or_suspended"
    category: "degraded"
    trigger: "Service is planned-maintenance, suspended or security-blocked."
    required_copy:
      title: "Dịch vụ tạm thời chưa khả dụng"
      body: "Hiển thị lý do công khai tối thiểu và kênh trạng thái đã duyệt."
    required_actions: ["view_service_status", "use_approved_help_channel"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-CRITICAL", "A11Y-STATUS", "A11Y-REFLOW"]
    trace_ids: ["UX-SCR-904", "SEC-CTRL-021"]
    prohibitions: ["invent_recovery_time", "leak_root_cause", "show_cached_success_over_block"]
  - id: "UX-STATE-012"
    key: "authentication_required_or_expired"
    category: "unauthorized"
    trigger: "No valid session exists or session has expired before authorization."
    required_copy:
      title: "Bạn cần đăng nhập"
      expired: "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại để tiếp tục."
    required_actions: ["sign_in", "return_to_safe_destination"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-AUTH", "A11Y-KEYBOARD", "A11Y-STATUS"]
    trace_ids: ["SEC-AUTHN-004", "SEC-AUTHN-009", "UX-INT-051"]
    prohibitions: ["expose_draft_to_different_account", "render_protected_data", "log_claims_or_token"]
  - id: "UX-STATE-013"
    key: "stale_data"
    category: "degraded"
    trigger: "Data is available but freshness is outside the approved threshold or unknown."
    required_copy:
      known: "Cập nhật lần cuối {timestamp}."
      unknown: "Chưa xác định thời điểm cập nhật."
    required_actions: ["refresh", "continue_read_only_when_policy_allows"]
    telemetry: ["ui.state.presented", "ui.action.invoked", "ui.state.recovered"]
    wcag_checks: ["A11Y-STATUS", "A11Y-NONCOLOR", "A11Y-DATA"]
    trace_ids: ["UX-CONTENT-006", "REQ-NF-REL-004"]
    prohibitions: ["claim_just_updated_when_unknown", "confirm_stale_availability", "hide_timestamp"]
  - id: "UX-STATE-014"
    key: "action_preview_ready"
    category: "confirmation"
    trigger: "Server-authoritative preview is complete and confirmation is allowed."
    required_copy:
      title: "Kiểm tra trước khi xác nhận"
      expiry: "Thông tin này có hiệu lực đến {expires_at}."
      consequence: "Nêu rõ dữ liệu, người nhận và hậu quả của hành động."
    required_actions: ["confirm_explicitly", "edit", "cancel"]
    telemetry: ["ui.confirmation.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-FORM-ERROR", "A11Y-DIALOG", "A11Y-KEYBOARD", "A11Y-TIME"]
    trace_ids: ["UX-ACT-001", "UX-ACT-002", "UX-ACT-003", "SEC-CTRL-008"]
    prohibitions: ["prechecked_confirmation", "hidden_consequence", "log_confirmation_token"]
  - id: "UX-STATE-015"
    key: "action_processing"
    category: "confirmation"
    trigger: "Confirmed idempotent action is executing or reconciling."
    required_copy:
      status: "Đang xử lý yêu cầu…"
      navigation: "Đừng gửi lại; hệ thống đang kiểm tra kết quả."
    required_actions: ["prevent_duplicate_submit", "show_persistent_status"]
    telemetry: ["ui.state.presented", "ui.state.recovered"]
    wcag_checks: ["A11Y-STATUS", "A11Y-TIME", "A11Y-KEYBOARD"]
    trace_ids: ["UX-ACT-004", "UX-ACT-006", "SEC-CTRL-008"]
    prohibitions: ["duplicate_submit", "optimistic_success", "lose_processing_reference"]
  - id: "UX-STATE-016"
    key: "action_succeeded"
    category: "confirmation"
    trigger: "Authoritative service result confirms the intended effect."
    required_copy:
      title: "Đã gửi yêu cầu"
      body: "Hiển thị mã tham chiếu, trạng thái, thời gian và bước tiếp theo thực tế."
    required_actions: ["view_result", "return_to_relevant_index"]
    telemetry: ["ui.confirmation.resolved", "ui.action.invoked"]
    wcag_checks: ["A11Y-STATUS", "A11Y-SEMANTICS", "A11Y-KEYBOARD"]
    trace_ids: ["UX-ACT-007", "SEC-CTRL-008"]
    prohibitions: ["claim_approved_when_only_submitted", "show_success_without_authoritative_result"]
  - id: "UX-STATE-017"
    key: "action_failed_no_effect"
    category: "error"
    trigger: "Authoritative service result proves no side effect occurred."
    required_copy:
      title: "Yêu cầu chưa được gửi"
      impact: "Không có thay đổi nào được ghi nhận."
    required_actions: ["safe_retry", "edit", "keep_draft"]
    telemetry: ["ui.confirmation.resolved", "ui.action.invoked"]
    wcag_checks: ["A11Y-FORM-ERROR", "A11Y-STATUS", "A11Y-KEYBOARD"]
    trace_ids: ["UX-ACT-008", "SEC-CTRL-008"]
    prohibitions: ["discard_draft", "use_when_effect_is_unknown"]
  - id: "UX-STATE-018"
    key: "action_result_unknown"
    category: "error"
    trigger: "Request may have crossed side-effect boundary but outcome cannot yet be proven."
    required_copy:
      title: "Đang kiểm tra kết quả"
      body: "Không gửi lại yêu cầu. Hệ thống đang đối chiếu trạng thái."
    required_actions: ["reconcile_status", "handover_if_unresolved"]
    telemetry: ["ui.state.presented", "ui.state.recovered", "ui.handover.presented"]
    wcag_checks: ["A11Y-CRITICAL", "A11Y-STATUS", "A11Y-TIME"]
    trace_ids: ["UX-ACT-009", "HITL-008", "SEC-CTRL-008"]
    prohibitions: ["immediate_resubmit", "map_to_generic_error", "claim_no_effect"]
  - id: "UX-STATE-019"
    key: "preview_expired_or_changed"
    category: "confirmation"
    trigger: "Preview expired or revalidation found a material change."
    required_copy:
      title: "Thông tin đã thay đổi"
      body: "Hãy kiểm tra phần thay đổi trước khi xác nhận lại."
    required_actions: ["review_changes", "request_new_preview", "cancel"]
    telemetry: ["ui.confirmation.resolved", "ui.action.invoked"]
    wcag_checks: ["A11Y-FORM-ERROR", "A11Y-NONCOLOR", "A11Y-TIME"]
    trace_ids: ["UX-ACT-005", "SEC-CTRL-008"]
    prohibitions: ["reuse_expired_confirmation", "silent_revalidation", "auto_confirm"]
  - id: "UX-STATE-020"
    key: "emergency_configuration_unavailable"
    category: "sensitive_handover"
    trigger: "Sensitive/emergency handover is needed but approved contact/configuration is absent."
    required_copy:
      demo: "DEMO — chưa cấu hình đầu mối khẩn cấp chính thức."
      production: "BLOCK_LAUNCH"
    required_actions: ["preserve_safe_context", "show_only_approved_general_help_if_configured"]
    telemetry: ["ui.handover.presented", "ui.action.invoked"]
    wcag_checks: ["A11Y-CRITICAL", "A11Y-DIALOG", "A11Y-KEYBOARD", "A11Y-STATUS"]
    trace_ids: ["UX-HITL-001", "UX-HITL-006", "HITL-008", "SEC-CTRL-025", "OQ-003"]
    prohibitions: ["invent_contact", "promise_response_time", "diagnose", "launch_real_user_surface"]
  - id: "UX-STATE-021"
