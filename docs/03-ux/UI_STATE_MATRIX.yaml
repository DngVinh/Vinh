cross_cutting_requirements:
  every_screen:
    required_wcag_checks: ["A11Y-SEMANTICS", "A11Y-KEYBOARD", "A11Y-NONCOLOR", "A11Y-REFLOW", "A11Y-LANGUAGE"]
    required_telemetry_events: ["ui.state.presented", "ui.action.invoked"]
    required_test_viewports: ["360x800", "768x1024", "1440x900"]
    required_negative_tests:
      - "authorization_checked_before_fetch"
      - "unknown_not_rendered_as_empty_or_zero"
      - "protected_content_absent_from_denied_dom_and_network_cache"
      - "telemetry_contains_no_prohibited_fields"
  sensitive_or_handover:
    matching_screens: ["UX-SCR-020", "UX-SCR-103", "UX-SCR-104", "UX-SCR-302", "UX-SCR-304", "UX-SCR-305"]
    required_wcag_checks: ["A11Y-CRITICAL", "A11Y-DIALOG", "A11Y-STATUS"]
    required_trace_ids: ["SEC-CTRL-003", "SEC-CTRL-018", "SEC-CTRL-025"]
    required_negative_tests:
      - "no_sensitive_text_in_notification_or_telemetry"
      - "no_unapproved_contact_or_response_promise"
      - "no_diagnosis_or_autonomous_high_impact_decision"
  confirmation:
    matching_states: ["UX-STATE-014", "UX-STATE-015", "UX-STATE-016", "UX-STATE-017", "UX-STATE-018", "UX-STATE-019"]
    required_trace_ids: ["UX-ACT-001", "UX-ACT-003", "UX-ACT-004", "UX-ACT-005", "UX-ACT-006", "UX-ACT-007", "UX-ACT-008", "UX-ACT-009", "SEC-CTRL-008"]
    required_negative_tests:
      - "payload_tamper_rejected"
      - "expired_confirmation_rejected"
      - "duplicate_activation_idempotent"
      - "disconnect_after_confirm_maps_to_result_unknown"

validation_rules:
  - id: "UI-MATRIX-VAL-001"
    rule: "Every screen_id and state_id MUST exist in the referenced UX prose documents."
    failure: "block_implementation"
  - id: "UI-MATRIX-VAL-002"
    rule: "Every screen MUST declare at least one role, state, primary action and trace ID."
    failure: "block_implementation"
  - id: "UI-MATRIX-VAL-003"
    rule: "Every state MUST declare category, trigger, required copy, telemetry, WCAG checks, trace IDs and prohibitions."
    failure: "block_implementation"
  - id: "UI-MATRIX-VAL-004"
    rule: "401 MUST map only to UX-STATE-012 and 403 MUST map only to UX-STATE-010."
    failure: "security_review_required"
  - id: "UI-MATRIX-VAL-005"
    rule: "All telemetry MUST comply with the allowlist and prohibited-field list in this document."
    failure: "privacy_gate_fails"
  - id: "UI-MATRIX-VAL-006"
    rule: "A screen implementation is incomplete until every required state has automated or reviewable evidence."
    failure: "task_not_accepted"
