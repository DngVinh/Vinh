requirements:
  - id: "REQ-F-GOV-001"
    title: "Display unofficial simulation disclaimer"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "system"
    preconditions: ["An entry or authenticated application surface is rendered."]
    statement: "The system MUST display Campus 24/7 — HUCE Demo and an unambiguous unofficial-simulation disclaimer."
    acceptance_criteria:
      - {id: "AC-REQ-F-GOV-001-01", given: "Any desktop or mobile entry/authenticated surface", when: "The surface renders", then: "The product name and disclaimer are visible without user interaction."}
    failure_behavior: "Missing or empty disclaimer configuration MUST block the login/chat surface."
    classification: {data: PUBLIC, security_impact: HIGH}
    trace: {objectives: [OBJ-007], use_cases: [UC-GOV-001], kpis: [KPI-021], profile: TP-GOV}
    depends_on: []

  - id: "REQ-F-GOV-002"
    title: "Mark synthetic records and exports"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "system"
    preconditions: ["A synthetic record is displayed or exported."]
    statement: "The system MUST mark the environment and data as synthetic and MUST NOT represent an action as accepted by HUCE."
    acceptance_criteria:
      - {id: "AC-REQ-F-GOV-002-01", given: "A record, detail page, receipt, or export", when: "It is produced", then: "It contains a machine-readable synthetic marker and a human-readable label."}
    failure_behavior: "Unknown provenance MUST prevent export or action completion."
    classification: {data: INTERNAL, security_impact: HIGH}
    trace: {objectives: [OBJ-007], use_cases: [UC-GOV-001], kpis: [KPI-021], profile: TP-GOV}
    depends_on: [REQ-F-GOV-001]

  - id: "REQ-F-AUTH-001"
    title: "Authenticate through internal identity adapter"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "demo_user"
    preconditions: ["The synthetic identity is active."]
    statement: "The system MUST authenticate through an internal identity adapter and create a server-side actor context."
    acceptance_criteria:
      - {id: "AC-REQ-F-AUTH-001-01", given: "An active synthetic account", when: "Valid demo authentication completes", then: "A session bound to the synthetic actor ID is created."}
    failure_behavior: "Invalid or disabled accounts MUST receive a generic denial."
    classification: {data: CONFIDENTIAL, security_impact: HIGH}
    trace: {objectives: [OBJ-003, OBJ-007], use_cases: [UC-AUTH-001], kpis: [KPI-006], profile: TP-AUTH}
    depends_on: [REQ-F-GOV-001]

  - id: "REQ-F-AUTH-002"
    title: "Derive identity from server session"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "system"
    preconditions: ["A protected request is received."]
    statement: "The system MUST derive actor ID, roles, and scopes from the server-side session and MUST NOT trust equivalent client fields."
    acceptance_criteria:
      - {id: "AC-REQ-F-AUTH-002-01", given: "A valid session and forged client identity fields", when: "A protected request is authorized", then: "The forged fields do not change the actor or authorization result."}
    failure_behavior: "Missing or invalid claims MUST deny the request."
    classification: {data: RESTRICTED, security_impact: CRITICAL}
    trace: {objectives: [OBJ-003, OBJ-007], use_cases: [UC-AUTH-001], kpis: [KPI-006], profile: TP-AUTH}
    depends_on: [REQ-F-AUTH-001]

  - id: "REQ-F-AUTH-003"
    title: "Invalidate session on logout"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "authenticated_user"
    preconditions: ["A valid session exists."]
    statement: "The system MUST support explicit logout that invalidates the current session."
    acceptance_criteria:
      - {id: "AC-REQ-F-AUTH-003-01", given: "A valid session", when: "The user logs out and the session is replayed", then: "The replay is denied."}
    failure_behavior: "A revocation failure MUST return an error and MUST NOT claim logout succeeded."
    classification: {data: CONFIDENTIAL, security_impact: HIGH}
    trace: {objectives: [OBJ-007], use_cases: [UC-AUTH-001], kpis: [KPI-006], profile: TP-AUTH}
    depends_on: [REQ-F-AUTH-001]

  - id: "REQ-F-AUTH-004"
    title: "Disable demo role switching in production"
    metadata: {type: functional, status: reviewed, priority: P0, release: V1}
    actor: "system"
    preconditions: ["The runtime profile is production."]
    statement: "The system MUST disable demo role switching and demo credential shortcuts in production."
    acceptance_criteria:
      - {id: "AC-REQ-F-AUTH-004-01", given: "Production configuration", when: "The application starts", then: "No switch-user endpoint, control, or shortcut is active."}
    failure_behavior: "Unsafe production configuration MUST fail startup or readiness."
    classification: {data: RESTRICTED, security_impact: CRITICAL}
    trace: {objectives: [OBJ-007], use_cases: [UC-AUTH-001], kpis: [KPI-006, KPI-021], profile: TP-AUTH}
